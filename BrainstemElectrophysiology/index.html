<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PLD - מעבדת מחקר מקיפה</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/holistic/holistic.js" crossorigin="anonymous"></script>

    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            text-align: center; 
            background-color: #111; 
            color: white; 
            margin: 0; 
            padding: 20px; 
        }
        button { 
            font-size: 18px; 
            padding: 12px 25px; 
            margin: 10px; 
            cursor: pointer; 
            border: none; 
            border-radius: 8px; 
            background-color: #0078D7; 
            color: white; 
            transition: 0.3s; 
        }
        button:disabled { background-color: #444; cursor: not-allowed; color: #888; }
        button:hover:not(:disabled) { background-color: #005a9e; }
        
        #container { 
            position: relative; 
            margin: 10px auto; 
            width: 800px; 
            height: 450px; 
            border: 2px solid #555; 
            border-radius: 10px; 
            overflow: hidden; 
            background-color: black; 
        }
        video { display: none; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        
        .controls { 
            background-color: #222; 
            padding: 10px; 
            border-radius: 10px; 
            display: inline-block; 
            margin-bottom: 10px; 
            border: 1px solid #444;
        }

        #main-status {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            padding: 10px 30px;
            border-radius: 20px;
            font-size: 22px;
            font-weight: bold;
            border: 2px solid #333;
            z-index: 10;
        }

        #peripheral-status {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 10px;
            font-size: 16px;
            text-align: right;
            border-right: 4px solid #00BCD4;
            color: #ddd;
            z-index: 10;
            min-width: 200px;
        }
        .peripheral-item { margin: 5px 0; transition: 0.1s; }
        .active-peripheral { color: #00FFFF; font-weight: bold; text-shadow: 0 0 5px rgba(0,255,255,0.5); }
        .trigger-item { color: #ddd; }
        .active-trigger { color: #FF9800; font-weight: bold; text-shadow: 0 0 5px rgba(255,152,0,0.5); }

    </style>
</head>
<body>

    <h1>מעבדת PLD: ניטור מלא</h1>
    
    <div class="controls">
        <button id="connectBtn">1. התחבר למיקרוביט</button>
        <button id="startCamBtn">2. הפעל מצלמה</button>
    </div>

    <div id="container">
        <video id="input_video" autoplay playsinline></video>
        <canvas id="output_canvas" width="1280" height="720"></canvas>
        
        <div id="main-status">ממתין להפעלה...</div>

        <div id="peripheral-status">
            <div id="ind-body-move" class="peripheral-item">תנועת גוף: --</div>
            <div id="ind-head-move" class="peripheral-item">תנועת ראש: --</div>
            <div id="ind-mouth" class="peripheral-item trigger-item">תנועת פה: --</div>
            <div id="ind-hand-move" class="peripheral-item">תנועת יד: --</div>
            <div id="ind-hand-touch" class="peripheral-item">מגע ביד: --</div>
            <div id="ind-face-touch" class="peripheral-item trigger-item">מגע בפנים: --</div>

        </div>
    </div>

    <script>
        // --- 1. תקשורת מיקרוביט (תוקן!) ---
        let port, writer;
        const connectBtn = document.getElementById('connectBtn');
        const mainStatusDiv = document.getElementById('main-status');

        connectBtn.addEventListener('click', async () => {
            try {
                port = await navigator.serial.requestPort();
                await port.open({ baudRate: 115200 });
                
                // הדרך הנכונה והיציבה לפתוח ערוץ כתיבה:
                const textEncoder = new TextEncoderStream();
                textEncoder.readable.pipeTo(port.writable);
                writer = textEncoder.writable.getWriter();
                
                mainStatusDiv.innerText = "מחובר למיקרוביט!";
                mainStatusDiv.style.borderColor = "#4CAF50";
                console.log("Serial port opened successfully.");
            } catch (error) {
                console.error("Serial connection error:", error);
                mainStatusDiv.innerText = "שגיאת התחברות. נתקו את המיקרוביט מהמחשב, חברו מחדש ונסו שנית";
                mainStatusDiv.style.borderColor = "#F44336";
            }
        });

        async function sendCommand(cmd) { 
            if (writer) {
                try {
                    await writer.write(cmd + '\r\n');
                    console.log("נשלח למיקרוביט:", cmd); // חיווי בקונסול לאימות שליחה
                } catch (err) {
                    console.error("שגיאה בשליחת הנתונים:", err);
                }
            }
        }

        // --- 2. פרמטרים ---
        const SEND_COOLDOWN = 100; 
        let lastSendTime = 0;
        
        let lastMouthDist = null;
        let lastNosePos = null;
        let lastBodyCenter = null;
        let lastLeftHand = null;
        let lastRightHand = null;

        const videoElement = document.getElementById('input_video');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');

        const holistic = new Holistic({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/holistic/${file}`});
        holistic.setOptions({
            modelComplexity: 1, smoothLandmarks: true, enableSegmentation: false,
            smoothSegmentation: false, refineFaceLandmarks: true,
            minDetectionConfidence: 0.5, minTrackingConfidence: 0.5
        });
        holistic.onResults(onResults);

        document.getElementById('startCamBtn').addEventListener('click', (e) => {
            e.target.disabled = true;
            mainStatusDiv.innerText = "טוען מצלמה...";
            new Camera(videoElement, { onFrame: async () => { await holistic.send({image: videoElement}); }, width: 1280, height: 720 }).start();
        });

        function getDistance(lm1, lm2) {
            if (!lm1 || !lm2) return 0;
            return Math.hypot(lm1.x - lm2.x, lm1.y - lm2.y);
        }

        function getCenter(landmarks) {
            if (!landmarks || landmarks.length === 0) return null;
            let sumX = 0, sumY = 0;
            landmarks.forEach(lm => { sumX += lm.x; sumY += lm.y; });
            return { x: sumX / landmarks.length, y: sumY / landmarks.length };
        }

        function drawPLDPoints(landmarks, color, size) {
            if (!landmarks) return;
            canvasCtx.fillStyle = color;
            landmarks.forEach(lm => {
                canvasCtx.beginPath();
                canvasCtx.arc(lm.x * canvasElement.width, lm.y * canvasElement.height, size, 0, 2 * Math.PI);
                canvasCtx.fill();
            });
        }

        function onResults(results) {
            canvasCtx.fillStyle = 'black';
            canvasCtx.fillRect(0, 0, canvasElement.width, canvasElement.height);

            drawPLDPoints(results.poseLandmarks, "#FF00FF", 4); 
            drawPLDPoints(results.faceLandmarks, "rgba(0, 255, 255, 0.6)", 2); 
            drawPLDPoints(results.leftHandLandmarks, "#FFFF00", 3); 
            drawPLDPoints(results.rightHandLandmarks, "#FFFF00", 3);

            let state = {
                mouthMove: false,
                faceTouch: false,
                headMove: false,
                bodyMove: false,
                handMove: false,
                handTouch: false
            };

            if (results.faceLandmarks && results.poseLandmarks) {
                const faceWidth = getDistance(results.faceLandmarks[33], results.faceLandmarks[263]);
                const shoulderWidth = getDistance(results.poseLandmarks[11], results.poseLandmarks[12]);
                
                if (faceWidth > 0.02 && shoulderWidth > 0.05) { 
                    
                    // 1. תנועת פה
                    const mouthDist = getDistance(results.faceLandmarks[13], results.faceLandmarks[14]);
                    if (lastMouthDist !== null && Math.abs(mouthDist - lastMouthDist) > faceWidth * 0.06) {
                        state.mouthMove = true;
                    }
                    lastMouthDist = mouthDist;

                    // 2. תנועת ראש
                    const noseFace = results.faceLandmarks[1];
                    if (lastNosePos && getDistance(noseFace, lastNosePos) / faceWidth > 0.05) {
                        state.headMove = true;
                    }
                    lastNosePos = noseFace;

                    // 3. תנועת גוף
                    const bodyCenter = getCenter([results.poseLandmarks[11], results.poseLandmarks[12], results.poseLandmarks[23], results.poseLandmarks[24]]);
                    if (lastBodyCenter && bodyCenter && getDistance(bodyCenter, lastBodyCenter) / shoulderWidth > 0.03) {
                        state.bodyMove = true;
                    }
                    lastBodyCenter = bodyCenter;

                    // 4. תנועת ידיים ומגע בפנים (תוקן!)
                    const leftHandCenter = getCenter(results.leftHandLandmarks);
                    const rightHandCenter = getCenter(results.rightHandLandmarks);

                    [results.leftHandLandmarks, results.rightHandLandmarks].forEach(hand => {
                        if (hand) {
                            // א. תנועת יד
                            const handCenter = getCenter(hand);
                            const lastHandCenter = (hand === results.leftHandLandmarks) ? lastLeftHand : lastRightHand;
                            if (lastHandCenter && getDistance(handCenter, lastHandCenter) / shoulderWidth > 0.08) {
                                state.handMove = true;
                            }
                            if (hand === results.leftHandLandmarks) lastLeftHand = handCenter;
                            else lastRightHand = handCenter;

                            // ב. מגע בפנים (ללא תלות בעומק מודל הגוף שקורס בהסתרה)
                            let isOverlapping = false;
                            for (let i of [8, 12, 16, 20]) { 
                                // בודק אם קצה האצבע בתוך רדיוס הפנים
                                if (getDistance(hand[i], noseFace) < faceWidth * 1.2) { 
                                    isOverlapping = true; break; 
                                }
                            }
                            
                            // מבחן פרספקטיבה: מוודא שהיד לא גדולה באופן חריג ביחס לפנים (כלומר לא מרחפת מול המצלמה)
                            const handSize = getDistance(hand[0], hand[9]);
                            if (isOverlapping && (handSize / faceWidth < 1.8)) {
                                state.faceTouch = true;
                            }
                        }
                    });

                    // 5. מגע ביד (יד נוגעת ביד)
                    if (leftHandCenter && rightHandCenter) {
                        if (getDistance(leftHandCenter, rightHandCenter) / shoulderWidth < 0.35) {
                            state.handTouch = true;
                        }
                    }
                }
            }

            // --- עדכון UI במסך ---
            const updateUI = (id, isActive, text, isTrigger) => {
                const el = document.getElementById(id);
                if (isActive) {
                    el.innerText = `🟢 ${text}`;
                    el.className = isTrigger ? "peripheral-item active-trigger" : "peripheral-item active-peripheral";
                } else {
                    el.innerText = `⚪ ${text}`;
                    el.className = isTrigger ? "peripheral-item trigger-item" : "peripheral-item";
                }
            };

            updateUI("ind-mouth", state.mouthMove, "תנועת פה", true);
            updateUI("ind-face-touch", state.faceTouch, "מגע בפנים", true);
            updateUI("ind-head-move", state.headMove, "תנועת ראש", false);
            updateUI("ind-body-move", state.bodyMove, "תנועת גוף", false);
            updateUI("ind-hand-move", state.handMove, "תנועת יד", false);
            updateUI("ind-hand-touch", state.handTouch, "מגע ביד", false);

            // --- שליחת הפקודה למיקרוביט (רק תנועת פה או מגע בפנים) ---
            const shouldSendS = state.mouthMove || state.faceTouch;
            const now = Date.now();

            if (shouldSendS && (now - lastSendTime > SEND_COOLDOWN)) {
                sendCommand('S'); 
                lastSendTime = now;
                mainStatusDiv.innerText = "שולח אות S!"; 
                mainStatusDiv.style.color = "#FF9800"; 
                mainStatusDiv.style.borderColor = "#FF9800"; 
            } else if (!shouldSendS && (now - lastSendTime > 400)) { 
                if(mainStatusDiv.innerText !== "סורק..." && !mainStatusDiv.innerText.includes("מחובר") && !mainStatusDiv.innerText.includes("טוען") && !mainStatusDiv.innerText.includes("שגיאה")) {
                    mainStatusDiv.innerText = "סורק..."; 
                    mainStatusDiv.style.color = "white";
                    mainStatusDiv.style.borderColor = "#333";
                }
            }
        }
    </script>
</body>
</html>
