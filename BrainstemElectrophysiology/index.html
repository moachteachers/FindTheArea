<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PLD - מעבדת מחקר מקיפה</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/holistic/holistic.js" crossorigin="anonymous"></script>

    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            text-align: center; 
            background-color: #111; 
            color: white; 
            margin: 0; 
            padding: 20px; 
        }
        button { 
            font-size: 18px; 
            padding: 12px 25px; 
            margin: 10px; 
            cursor: pointer; 
            border: none; 
            border-radius: 8px; 
            background-color: #0078D7; 
            color: white; 
            transition: 0.3s; 
        }
        button:disabled { background-color: #444; cursor: not-allowed; color: #888; }
        button:hover:not(:disabled) { background-color: #005a9e; }
        
        #container { 
            position: relative; 
            margin: 10px auto; 
            width: 800px; 
            height: 450px; 
            border: 2px solid #555; 
            border-radius: 10px; 
            overflow: hidden; 
            background-color: black; 
        }
        video { display: none; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        
        .controls { 
            background-color: #222; 
            padding: 10px; 
            border-radius: 10px; 
            display: inline-block; 
            margin-bottom: 10px; 
            border: 1px solid #444;
        }

        /* עיצוב חיווי הפנים המרכזי (שולח למיקרוביט) */
        #main-status {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            padding: 10px 30px;
            border-radius: 20px;
            font-size: 22px;
            font-weight: bold;
            border: 2px solid #333;
            z-index: 10;
        }

        /* עיצוב לוח הזיהוי ההיקפי (תצוגה בלבד) */
        #peripheral-status {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 10px;
            font-size: 16px;
            text-align: right;
            border-right: 4px solid #00BCD4;
            color: #ddd;
            z-index: 10;
            min-width: 200px;
        }
        .peripheral-item { margin: 5px 0; }
        .active-peripheral { color: #00FFFF; font-weight: bold; }

    </style>
</head>
<body>

    <h1>מעבדת PLD מורחבת: פנים וגוף</h1>
    
    <div class="controls">
        <button id="connectBtn">1. התחבר למיקרוביט</button>
        <button id="startCamBtn">2. הפעל מצלמה</button>
    </div>

    <div id="container">
        <video id="input_video" autoplay playsinline></video>
        <canvas id="output_canvas" width="1280" height="720"></canvas>
        
        <div id="main-status">ממתין להפעלה...</div>

        <div id="peripheral-status">
            <div style="color: #888; font-size: 12px; margin-bottom: 8px;">ניטור היקפי (תצוגה בלבד):</div>
            <div id="ind-hand-move" class="peripheral-item">תנועת ידיים: --</div>
            <div id="ind-body-move" class="peripheral-item">תנועת גוף: --</div>
            <div id="ind-hand-touch" class="peripheral-item">מגע בידיים: --</div>
            <div id="ind-body-touch" class="peripheral-item">מגע בגוף: --</div>
        </div>
    </div>

    <script>
        // --- תקשורת מיקרוביט ---
        let port, writer;
        const connectBtn = document.getElementById('connectBtn');
        const mainStatusDiv = document.getElementById('main-status');

        connectBtn.addEventListener('click', async () => {
            try {
                port = await navigator.serial.requestPort();
                await port.open({ baudRate: 115200 });
                writer = new TextEncoderStream().readable.pipeTo(port.writable) && new TextEncoderStream().writable.getWriter();
                mainStatusDiv.innerText = "מחובר למיקרוביט!";
                mainStatusDiv.style.borderColor = "#4CAF50";
            } catch (error) {
                mainStatusDiv.innerText = "שגיאת התחברות.";
                mainStatusDiv.style.borderColor = "#F44336";
            }
        });

        async function sendCommand(cmd) { if (writer) await writer.write(cmd + '\r\n'); }

        // --- פרמטרים ומשתני עבר ---
        const SEND_COOLDOWN = 400; 
        let lastSendTime = 0;
        
        let lastMouthDist = null, lastLeftEyeDist = null;
        let lastBodyCenter = null, lastLeftHand = null, lastRightHand = null;

        const videoElement = document.getElementById('input_video');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');

        const holistic = new Holistic({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/holistic/${file}`});
        holistic.setOptions({
            modelComplexity: 1, smoothLandmarks: true, enableSegmentation: false,
            smoothSegmentation: false, refineFaceLandmarks: true,
            minDetectionConfidence: 0.5, minTrackingConfidence: 0.5
        });
        holistic.onResults(onResults);

        document.getElementById('startCamBtn').addEventListener('click', (e) => {
            e.target.disabled = true;
            mainStatusDiv.innerText = "טוען מצלמה...";
            new Camera(videoElement, { onFrame: async () => { await holistic.send({image: videoElement}); }, width: 1280, height: 720 }).start();
        });

        // --- פונקציות מתמטיות ---
        function getDistance(lm1, lm2) {
            if (!lm1 || !lm2) return 0;
            return Math.hypot(lm1.x - lm2.x, lm1.y - lm2.y);
        }

        function getCenter(landmarks) {
            if (!landmarks || landmarks.length === 0) return null;
            let sumX = 0, sumY = 0;
            landmarks.forEach(lm => { sumX += lm.x; sumY += lm.y; });
            return { x: sumX / landmarks.length, y: sumY / landmarks.length };
        }

        function drawPLDPoints(landmarks, color, size) {
            if (!landmarks) return;
            canvasCtx.fillStyle = color;
            landmarks.forEach(lm => {
                canvasCtx.beginPath();
                canvasCtx.arc(lm.x * canvasElement.width, lm.y * canvasElement.height, size, 0, 2 * Math.PI);
                canvasCtx.fill();
            });
        }

        // --- לולאת הזיהוי ---
        function onResults(results) {
            canvasCtx.fillStyle = 'black';
            canvasCtx.fillRect(0, 0, canvasElement.width, canvasElement.height);

            drawPLDPoints(results.poseLandmarks, "#FF00FF", 4); // גוף מג'נטה
            drawPLDPoints(results.faceLandmarks, "rgba(0, 255, 255, 0.6)", 2); // פנים טורקיז
            drawPLDPoints(results.leftHandLandmarks, "#FFFF00", 3); // ידיים צהוב
            drawPLDPoints(results.rightHandLandmarks, "#FFFF00", 3);

            let isFaceTriggered = false;
            let faceEventText = "";

            // משתני אינדיקציה היקפית (מסך בלבד)
            let indHandMove = false, indBodyMove = false, indHandTouch = false, indBodyTouch = false;

            if (results.faceLandmarks && results.poseLandmarks) {
                const faceWidth = getDistance(results.faceLandmarks[33], results.faceLandmarks[263]);
                const shoulderWidth = getDistance(results.poseLandmarks[11], results.poseLandmarks[12]);
                
                if (faceWidth > 0.02 && shoulderWidth > 0.05) { 
                    
                    // ==========================================
                    // חלק א': זיהוי פנים (משדר למיקרוביט)
                    // ==========================================
                    const mouthDist = getDistance(results.faceLandmarks[13], results.faceLandmarks[14]);
                    const leftEyeDist = getDistance(results.faceLandmarks[159], results.faceLandmarks[145]);
                    const expressionThreshold = faceWidth * 0.06; 

                    if (lastMouthDist !== null) {
                        if (Math.abs(mouthDist - lastMouthDist) > expressionThreshold) {
                            isFaceTriggered = true; faceEventText = "תנועת פה!";
                        } else if (Math.abs(leftEyeDist - lastLeftEyeDist) > expressionThreshold) {
                            isFaceTriggered = true; faceEventText = "תנועת עיניים!";
                        }
                    }
                    lastMouthDist = mouthDist; lastLeftEyeDist = leftEyeDist;

                    if (!isFaceTriggered) { 
                        const noseFace = results.faceLandmarks[1];
                        const nosePose = results.poseLandmarks[0];

                        [results.leftHandLandmarks, results.rightHandLandmarks].forEach(hand => {
                            if (hand && !isFaceTriggered) {
                                let isOverlapping = false;
                                for (let i of [8, 12, 16, 20]) { 
                                    if (getDistance(hand[i], noseFace) / faceWidth < 1.5) { isOverlapping = true; break; }
                                }
                                const wrist = hand[0]; // מחלצים משורש כף היד של מודל הידיים
                                // מציאת מזהה תואם במודל הגוף כדי לקבל Z אמין
                                const poseWrist = (hand === results.leftHandLandmarks) ? results.poseLandmarks[15] : results.poseLandmarks[16];
                                
                                if (poseWrist) {
                                    const distZ = Math.abs(poseWrist.z - nosePose.z) / shoulderWidth;
                                    if (isOverlapping && distZ < 0.6) {
                                        isFaceTriggered = true; faceEventText = "מגע בפנים!";
                                    }
                                }
                            }
                        });
                    }

                    // ==========================================
                    // חלק ב': זיהוי היקפי (תצוגה בלבד!)
                    // ==========================================
                    const bodyCenter = getCenter([results.poseLandmarks[11], results.poseLandmarks[12], results.poseLandmarks[23], results.poseLandmarks[24]]);
                    const leftHandCenter = getCenter(results.leftHandLandmarks);
                    const rightHandCenter = getCenter(results.rightHandLandmarks);

                    // 1. תנועת גוף
                    if (lastBodyCenter && bodyCenter && getDistance(bodyCenter, lastBodyCenter) / shoulderWidth > 0.03) {
                        indBodyMove = true;
                    }
                    lastBodyCenter = bodyCenter;

                    // 2. תנועת ידיים
                    if (leftHandCenter && lastLeftHand && getDistance(leftHandCenter, lastLeftHand) / shoulderWidth > 0.08) indHandMove = true;
                    if (rightHandCenter && lastRightHand && getDistance(rightHandCenter, lastRightHand) / shoulderWidth > 0.08) indHandMove = true;
                    lastLeftHand = leftHandCenter; lastRightHand = rightHandCenter;

                    // 3. מגע בין הידיים (יד ליד)
                    if (leftHandCenter && rightHandCenter) {
                        if (getDistance(leftHandCenter, rightHandCenter) / shoulderWidth < 0.35) {
                            indHandTouch = true;
                        }
                    }

                    // 4. מגע של הידיים בגוף
                    const torsoPoints = [results.poseLandmarks[11], results.poseLandmarks[12], results.poseLandmarks[23], results.poseLandmarks[24]]; // כתפיים ומותניים
                    [leftHandCenter, rightHandCenter].forEach(hand => {
                        if (hand) {
                            torsoPoints.forEach(torsoPt => {
                                if (getDistance(hand, torsoPt) / shoulderWidth < 0.25) indBodyTouch = true;
                            });
                        }
                    });
                }
            }

            // --- עדכון חיווי הפנים המרכזי והשידור (מיקרוביט) ---
            const now = Date.now();
            if (isFaceTriggered && (now - lastSendTime > SEND_COOLDOWN)) {
                sendCommand('S'); 
                lastSendTime = now;
                mainStatusDiv.innerText = `זיהוי פעיל: ${faceEventText}`; 
                mainStatusDiv.style.color = "#FF9800"; 
                mainStatusDiv.style.borderColor = "#FF9800"; 
            } else if (!isFaceTriggered && (now - lastSendTime > SEND_COOLDOWN)) {
                if(mainStatusDiv.innerText !== "אין זיהוי פעיל" && !mainStatusDiv.innerText.includes("מחובר") && !mainStatusDiv.innerText.includes("טוען")) {
                    mainStatusDiv.innerText = "אין זיהוי פעיל"; 
                    mainStatusDiv.style.color = "white";
                    mainStatusDiv.style.borderColor = "#333";
                }
            }

            // --- עדכון חיווי הניטור ההיקפי (UI בלבד) ---
            const updateIndicator = (id, isActive, text) => {
                const el = document.getElementById(id);
                if (isActive) {
                    el.innerText = `🟢 ${text}`;
                    el.className = "peripheral-item active-peripheral";
                } else {
                    el.innerText = `⚪ ${text}`;
                    el.className = "peripheral-item";
                }
            };

            updateIndicator("ind-hand-move", indHandMove, "תנועת ידיים");
            updateIndicator("ind-body-move", indBodyMove, "תנועת גוף");
            updateIndicator("ind-hand-touch", indHandTouch, "מגע בידיים");
            updateIndicator("ind-body-touch", indBodyTouch, "מגע בגוף");
        }
    </script>
</body>
</html>
