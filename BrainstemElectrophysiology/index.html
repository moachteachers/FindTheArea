<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PLD - מעבדה ברזולוציה גבוהה</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/holistic/holistic.js" crossorigin="anonymous"></script>

    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; background-color: #111; color: white; margin: 0; padding: 20px; }
        button { font-size: 18px; padding: 12px 25px; margin: 10px; cursor: pointer; border: none; border-radius: 8px; background-color: #0078D7; color: white; transition: 0.3s; }
        button:disabled { background-color: #444; cursor: not-allowed; color: #888; }
        button:hover:not(:disabled) { background-color: #005a9e; }
        
        /* הגדלנו את הקונטיינר כדי שיתאים ליחס HD 16:9 */
        #container { position: relative; margin: 10px auto; width: 800px; height: 450px; border: 2px solid #555; border-radius: 10px; overflow: hidden; background-color: black; }
        video { display: none; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        
        #status { font-size: 24px; margin-top: 10px; min-height: 35px; font-weight: bold; }
        .controls { background-color: #222; padding: 10px; border-radius: 10px; display: inline-block; margin-bottom: 10px; border: 1px solid #444;}
        
        #debug-panel { background-color: rgba(0,0,0,0.8); border: 1px solid #444; padding: 15px; border-radius: 10px; display: inline-block; margin-top: 15px; font-family: monospace; text-align: left; direction: ltr; min-width: 320px; }
        .debug-row { margin: 5px 0; font-size: 15px; display: flex; justify-content: space-between;}
        .val-good { color: #4CAF50; font-weight: bold;}
        .val-bad { color: #F44336; font-weight: bold;}
        .val-warn { color: #FFC107; font-weight: bold;}
    </style>
</head>
<body>

    <h1>מעבדת PLD: זיהוי עומק ב-HD (תיקון למרחק)</h1>
    
    <div class="controls">
        <button id="connectBtn">1. התחבר למיקרוביט</button>
        <button id="startCamBtn">2. הפעל מצלמה (HD)</button>
    </div>

    <div id="status">ממתין לפעולה...</div>

    <div id="container">
        <video id="input_video" autoplay playsinline></video>
        <canvas id="output_canvas" width="1280" height="720"></canvas>
    </div>

    <div id="debug-panel">
        <div style="text-align: center; color: #aaa; margin-bottom: 10px; border-bottom: 1px solid #444; padding-bottom: 5px;">בקרת מרחק ותלת-ממד</div>
        <div class="debug-row"><span>Face Size (Stable > 0.03):</span> <span id="dbg-facesize" style="color: #888;">0.00</span></div>
        <div class="debug-row"><span>XY Overlap:</span> <span id="dbg-overlap" style="color: #888;">No</span></div>
        <div class="debug-row"><span>Perspective Ratio:</span> <span id="dbg-ratio" style="color: #888;">0.00</span></div>
        <div class="debug-row"><span>3D Z-Depth Diff:</span> <span id="dbg-z" style="color: #888;">0.00</span></div>
    </div>

    <script>
        // -- חיבור למיקרוביט --
        let port, writer;
        const connectBtn = document.getElementById('connectBtn');
        const statusDiv = document.getElementById('status');

        connectBtn.addEventListener('click', async () => {
            try {
                port = await navigator.serial.requestPort();
                await port.open({ baudRate: 115200 });
                const textEncoder = new TextEncoderStream();
                textEncoder.readable.pipeTo(port.writable);
                writer = textEncoder.writable.getWriter();
                statusDiv.innerText = "מחובר למיקרוביט בהצלחה!";
                statusDiv.style.color = "#4CAF50";
            } catch (error) {
                statusDiv.innerText = "שגיאת התחברות למיקרוביט.";
                statusDiv.style.color = "#F44336";
            }
        });

        async function sendCommand(cmd) { if (writer) await writer.write(cmd + '\r\n'); }

        // -- פרמטרים חדשים מותאמים למרחק --
        const SEND_COOLDOWN = 300; 
        
        // עכשיו זה אחוז מרוחב הפנים, לא מספר קבוע! 0.06 אומר 6% מרוחב הפנים שלך.
        const EXPRESSION_RATIO = 0.06; 
        
        const TOUCH_MULTIPLIER = 1.3; 
        const MAX_HAND_FACE_RATIO = 2.0; // הוגדל מעט כי ב-HD הידיים נראות קצת יותר מדויקות
        const MAX_Z_DEPTH_TOLERANCE = 0.45; 

        // -- אלמנטים דיבאג --
        const dbgFaceSize = document.getElementById('dbg-facesize');
        const dbgOverlap = document.getElementById('dbg-overlap');
        const dbgRatio = document.getElementById('dbg-ratio');
        const dbgZ = document.getElementById('dbg-z');

        const videoElement = document.getElementById('input_video');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const startCamBtn = document.getElementById('startCamBtn');

        let lastMouthDist = null, lastLeftEyeDist = null, lastRightEyeDist = null;
        let lastSendTime = 0;

        const holistic = new Holistic({locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/holistic/${file}`;
        }});

        // הגדרנו אופטימיזציות למעקב מדויק יותר
        holistic.setOptions({
            modelComplexity: 1, 
            smoothLandmarks: true, 
            enableSegmentation: false,
            smoothSegmentation: false, 
            refineFaceLandmarks: true,
            minDetectionConfidence: 0.5, 
            minTrackingConfidence: 0.5
        });

        holistic.onResults(onResults);

        startCamBtn.addEventListener('click', () => {
            startCamBtn.disabled = true;
            statusDiv.innerText = "טוען מצלמת HD...";
            statusDiv.style.color = "white";
            
            // השדרוג העיקרי למצלמה: דרישה לרזולוציה גבוהה
            const camera = new Camera(videoElement, {
                onFrame: async () => { await holistic.send({image: videoElement}); },
                width: 1280, 
                height: 720
            });
            camera.start();
        });

        function getDistance(lm1, lm2) {
            if (!lm1 || !lm2) return 0;
            return Math.hypot(lm1.x - lm2.x, lm1.y - lm2.y);
        }

        function getCenter(landmarks) {
            if (!landmarks || landmarks.length === 0) return null;
            let sumX = 0, sumY = 0;
            landmarks.forEach(lm => { sumX += lm.x; sumY += lm.y; });
            return { x: sumX / landmarks.length, y: sumY / landmarks.length };
        }

        function checkAdvanced3DTouch(handLandmarks, faceCenter, faceWidth, poseLandmarks) {
            if (!handLandmarks || !faceCenter || !faceWidth || !poseLandmarks) return false;

            // הגנת מרחק: אם הפנים קטנות מדי מ-3% משטח המסך, אי אפשר לחשב פרופורציות בלי שגיאות מתמטיות.
            dbgFaceSize.innerText = faceWidth.toFixed(3);
            if (faceWidth < 0.03) {
                dbgFaceSize.className = "val-warn";
                dbgOverlap.innerText = "Too Far"; dbgOverlap.className = "val-warn";
                return false;
            }
            dbgFaceSize.className = "val-good";

            let isOverlapping = false;
            for (let i of [8, 12, 16, 20]) { 
                if (getDistance(handLandmarks[i], faceCenter) < faceWidth * TOUCH_MULTIPLIER) {
                    isOverlapping = true; break;
                }
            }

            if (!isOverlapping) {
                dbgOverlap.innerText = "No"; dbgOverlap.className = "val-bad";
                return false;
            }
            dbgOverlap.innerText = "Yes"; dbgOverlap.className = "val-good";

            let handSize = getDistance(handLandmarks[0], handLandmarks[9]);
            let ratio = handSize / faceWidth;
            dbgRatio.innerText = `${ratio.toFixed(2)} (Max: ${MAX_HAND_FACE_RATIO})`;
            
            if (ratio > MAX_HAND_FACE_RATIO) {
                dbgRatio.className = "val-bad";
                return false; 
            }
            dbgRatio.className = "val-good";

            let shoulderWidth = getDistance(poseLandmarks[11], poseLandmarks[12]);
            if (shoulderWidth < 0.05) return false; // הגנה נוספת כשהמשתמש רחוק מאוד
            
            let noseZ = poseLandmarks[0].z;
            let leftWristZ = poseLandmarks[15].z;
            let rightWristZ = poseLandmarks[16].z;
            
            let activeZDiff = Math.min(Math.abs(noseZ - leftWristZ), Math.abs(noseZ - rightWristZ));
            let normalizedZDepth = activeZDiff / shoulderWidth;
            
            dbgZ.innerText = `${normalizedZDepth.toFixed(2)} (Max: ${MAX_Z_DEPTH_TOLERANCE.toFixed(2)})`;

            if (normalizedZDepth > MAX_Z_DEPTH_TOLERANCE) {
                dbgZ.className = "val-bad";
                return false; 
            }
            
            dbgZ.className = "val-good";
            return true; 
        }

        function drawPLDPoints(landmarks, color = "white", size = 3) {
            if (!landmarks) return;
            canvasCtx.fillStyle = color;
            landmarks.forEach(lm => {
                canvasCtx.beginPath();
                canvasCtx.arc(lm.x * canvasElement.width, lm.y * canvasElement.height, size, 0, 2 * Math.PI);
                canvasCtx.fill();
            });
        }

        function onResults(results) {
            canvasCtx.fillStyle = 'black';
            canvasCtx.fillRect(0, 0, canvasElement.width, canvasElement.height);

            drawPLDPoints(results.poseLandmarks, "#FF00FF", 4); 
            drawPLDPoints(results.faceLandmarks, "rgba(0, 255, 255, 0.6)", 2);
            drawPLDPoints(results.leftHandLandmarks, "#FFFF00", 3);
            drawPLDPoints(results.rightHandLandmarks, "#FFFF00", 3);

            let triggerS = false;
            let eventText = "";

            if (results.faceLandmarks && results.poseLandmarks) {
                
                // חישוב רוחב הפנים עבור סף דינמי
                const faceWidth = getDistance(results.faceLandmarks[33], results.faceLandmarks[263]);
                
                // סף הרגישות כעת משתנה בהתאם למרחק שלך מהמצלמה!
                const dynamicExpressionThreshold = faceWidth * EXPRESSION_RATIO;

                const mouthDist = getDistance(results.faceLandmarks[13], results.faceLandmarks[14]);
                const leftEyeDist = getDistance(results.faceLandmarks[159], results.faceLandmarks[145]);
                const rightEyeDist = getDistance(results.faceLandmarks[386], results.faceLandmarks[374]);

                if (lastMouthDist !== null && faceWidth > 0.03) { // נחשב הבעות רק אם הפנים גדולות מספיק
                    if (Math.abs(mouthDist - lastMouthDist) > dynamicExpressionThreshold) {
                        triggerS = true; eventText = "תנועת פה!";
                    }
                    else if (Math.abs(leftEyeDist - lastLeftEyeDist) > dynamicExpressionThreshold || 
                             Math.abs(rightEyeDist - lastRightEyeDist) > dynamicExpressionThreshold) {
                        triggerS = true; eventText = "תנועת עיניים!";
                    }
                }

                lastMouthDist = mouthDist; lastLeftEyeDist = leftEyeDist; lastRightEyeDist = rightEyeDist;

                if (!triggerS) { 
                    let currentFaceCenter = getCenter(results.faceLandmarks);
                    let touchLeft = checkAdvanced3DTouch(results.leftHandLandmarks, currentFaceCenter, faceWidth, results.poseLandmarks);
                    let touchRight = checkAdvanced3DTouch(results.rightHandLandmarks, currentFaceCenter, faceWidth, results.poseLandmarks);
                    
                    if (touchLeft || touchRight) {
                        triggerS = true;
                        eventText = "מגע תלת-ממדי!";
                    }
                }
            }

            const now = Date.now();
            if (triggerS && (now - lastSendTime > SEND_COOLDOWN)) {
                sendCommand('S'); lastSendTime = now;
                statusDiv.innerText = `זיהוי: ${eventText}`; statusDiv.style.color = "#4CAF50";
                setTimeout(() => { if (Date.now() - lastSendTime >= SEND_COOLDOWN) { statusDiv.innerText = "עוקב..."; statusDiv.style.color = "white"; } }, 500);
            } else if (!triggerS && (now - lastSendTime > SEND_COOLDOWN)) {
                if(statusDiv.innerText !== "עוקב..." && statusDiv.innerText !== "מחובר למיקרוביט בהצלחה!" && !statusDiv.innerText.includes("טוען")) {
                    statusDiv.innerText = "עוקב..."; statusDiv.style.color = "white";
                }
            }
        }
    </script>
</body>
</html>
