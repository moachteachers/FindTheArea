<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Point Light Display - מעבדת מחקר תנועה ומגע</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/holistic/holistic.js" crossorigin="anonymous"></script>

    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            text-align: center; 
            background-color: #111; 
            color: white; 
            margin: 0; 
            padding: 20px; 
        }
        button { 
            font-size: 18px; 
            padding: 12px 25px; 
            margin: 10px; 
            cursor: pointer; 
            border: none; 
            border-radius: 8px; 
            background-color: #0078D7; 
            color: white; 
            transition: 0.3s; 
        }
        button:disabled { background-color: #444; cursor: not-allowed; color: #888; }
        button:hover:not(:disabled) { background-color: #005a9e; }
        
        #container { 
            position: relative; 
            margin: 10px auto; 
            width: 800px; 
            height: 450px; 
            border: 2px solid #555; 
            border-radius: 10px; 
            overflow: hidden; 
            background-color: black; 
        }
        video { display: none; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        
        #status { 
            font-size: 24px; 
            margin-top: 15px; 
            min-height: 35px; 
            font-weight: bold; 
        }
        .controls { 
            background-color: #222; 
            padding: 10px; 
            border-radius: 10px; 
            display: inline-block; 
            margin-bottom: 10px; 
            border: 1px solid #444;
        }
    </style>
</head>
<body>

    <h1>Point Light Display - מעבדת מחקר תנועה ומגע</h1>
    
    <div class="controls">
        <button id="connectBtn">1. התחבר למיקרוביט</button>
        <button id="startCamBtn">2. הפעל מצלמה</button>
    </div>

    <div id="status">ממתין לפעולה...</div>

    <div id="container">
        <video id="input_video" autoplay playsinline></video>
        <canvas id="output_canvas" width="1280" height="720"></canvas>
    </div>

    <script>
        // --- תקשורת למיקרוביט ---
        let port, writer;
        const connectBtn = document.getElementById('connectBtn');
        const statusDiv = document.getElementById('status');

        connectBtn.addEventListener('click', async () => {
            try {
                port = await navigator.serial.requestPort();
                await port.open({ baudRate: 115200 });
                const textEncoder = new TextEncoderStream();
                textEncoder.readable.pipeTo(port.writable);
                writer = textEncoder.writable.getWriter();
                statusDiv.innerText = "מחובר למיקרוביט בהצלחה!";
                statusDiv.style.color = "#4CAF50";
            } catch (error) {
                statusDiv.innerText = "שגיאת התחברות למיקרוביט.";
                statusDiv.style.color = "#F44336";
            }
        });

        async function sendCommand(cmd) { if (writer) await writer.write(cmd + '\r\n'); }

        // --- פרמטרים ---
        const SEND_COOLDOWN = 400; 
        let lastSendTime = 0;
        let lastMouthDist = null;
        let lastLeftEyeDist = null;

        const videoElement = document.getElementById('input_video');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const startCamBtn = document.getElementById('startCamBtn');

        const holistic = new Holistic({locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/holistic/${file}`;
        }});

        holistic.setOptions({
            modelComplexity: 1, 
            smoothLandmarks: true, 
            enableSegmentation: false,
            smoothSegmentation: false, 
            refineFaceLandmarks: true,
            minDetectionConfidence: 0.5, 
            minTrackingConfidence: 0.5
        });

        holistic.onResults(onResults);

        startCamBtn.addEventListener('click', () => {
            startCamBtn.disabled = true;
            statusDiv.innerText = "טוען מצלמה...";
            statusDiv.style.color = "white";
            const camera = new Camera(videoElement, {
                onFrame: async () => { await holistic.send({image: videoElement}); },
                width: 1280, height: 720
            });
            camera.start();
        });

        function getDistance(lm1, lm2) {
            if (!lm1 || !lm2) return 0;
            return Math.hypot(lm1.x - lm2.x, lm1.y - lm2.y);
        }

        function drawPLDPoints(landmarks, color, size) {
            if (!landmarks) return;
            canvasCtx.fillStyle = color;
            landmarks.forEach(lm => {
                canvasCtx.beginPath();
                canvasCtx.arc(lm.x * canvasElement.width, lm.y * canvasElement.height, size, 0, 2 * Math.PI);
                canvasCtx.fill();
            });
        }

        function onResults(results) {
            canvasCtx.fillStyle = 'black';
            canvasCtx.fillRect(0, 0, canvasElement.width, canvasElement.height);

            // שמירה על עיצוב מדעי נקי (ללא אפקטים, רק נקודות ממופות)
            drawPLDPoints(results.poseLandmarks, "#FF00FF", 4); 
            drawPLDPoints(results.faceLandmarks, "rgba(0, 255, 255, 0.6)", 2); 
            drawPLDPoints(results.leftHandLandmarks, "#FFFF00", 3); 
            drawPLDPoints(results.rightHandLandmarks, "#FFFF00", 3);

            let isTriggered = false;
            let currentEventText = "";

            if (results.faceLandmarks) {
                const faceWidth = getDistance(results.faceLandmarks[33], results.faceLandmarks[263]);
                
                if (faceWidth > 0.02) { 
                    
                    // --- 1. הבעות פנים ---
                    const mouthDist = getDistance(results.faceLandmarks[13], results.faceLandmarks[14]);
                    const leftEyeDist = getDistance(results.faceLandmarks[159], results.faceLandmarks[145]);
                    const expressionThreshold = faceWidth * 0.06; 

                    if (lastMouthDist !== null) {
                        if (Math.abs(mouthDist - lastMouthDist) > expressionThreshold) {
                            isTriggered = true; currentEventText = "תנועת פה!";
                        }
                        else if (Math.abs(leftEyeDist - lastLeftEyeDist) > expressionThreshold) {
                            isTriggered = true; currentEventText = "תנועת עיניים!";
                        }
                    }
                    lastMouthDist = mouthDist; lastLeftEyeDist = leftEyeDist;

                    // --- 2. מגע בפנים (ללא תלות בכתפיים או במודל הגוף) ---
                    if (!isTriggered) { 
                        const nose = results.faceLandmarks[1];
                        const hands = [results.leftHandLandmarks, results.rightHandLandmarks];

                        for (let hand of hands) {
                            if (hand && !isTriggered) {
                                // בדיקת פרספקטיבה (השוואת גודל היד לרוחב הפנים)
                                const handSize = getDistance(hand[0], hand[9]);
                                const handFaceRatio = handSize / faceWidth;

                                // מוודא שהיד אינה מוגדלת עקב קירוב למצלמה
                                if (handFaceRatio < 2.5) { 
                                    // מעבר על קצות האצבעות
                                    for (let i of [8, 12, 16, 20]) {
                                        const distToNose = getDistance(hand[i], nose);
                                        // 1.2 = רדיוס המכסה את הפנים ביחס לרוחבן
                                        if (distToNose < faceWidth * 1.2) {
                                            isTriggered = true;
                                            currentEventText = "מגע בפנים!";
                                            break;
                                        }
                                    }
                                }
                            }
                        }
                    }
                }
            }

            // --- שליחה למיקרוביט וניהול חיווי תצוגה ---
            const now = Date.now();
            if (isTriggered && (now - lastSendTime > SEND_COOLDOWN)) {
                sendCommand('S'); 
                lastSendTime = now;
                statusDiv.innerText = `זיהוי פעיל: ${currentEventText}`; 
                statusDiv.style.color = "#FF9800"; 
            } else if (!isTriggered && (now - lastSendTime > SEND_COOLDOWN)) {
                if(statusDiv.innerText !== "אין זיהוי פעיל" && statusDiv.innerText !== "מחובר למיקרוביט בהצלחה!" && !statusDiv.innerText.includes("טוען")) {
                    statusDiv.innerText = "אין זיהוי פעיל"; 
                    statusDiv.style.color = "white";
                }
            }
        }
    </script>
</body>
</html>
