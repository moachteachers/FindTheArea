<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title> PLD</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/holistic/holistic.js" crossorigin="anonymous"></script>
    <style>
        body { font-family: sans-serif; background: #111; color: #fff; text-align: center; }
        #canvas-wrapper { position: relative; width: 640px; margin: 20px auto; }
        canvas { border: 2px solid white; }
    </style>
</head>
<body>
    <h1>מצב בדיקה (Debug)</h1>
    <button onclick="start()">הפעל מצלמה</button>
    <div id="canvas-wrapper">
        <video id="input" style="display:none"></video>
        <canvas id="output" width="640" height="480"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('output');
        const ctx = canvas.getContext('2d');
        const holistic = new Holistic({locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/holistic/${f}`});

        holistic.onResults(onResults);
        
        function start() {
            new Camera(document.getElementById('input'), {
                onFrame: () => holistic.send({image: document.getElementById('input')}),
                width: 640, height: 480
            }).start();
        }

        function onResults(results) {
            ctx.fillStyle = 'black'; ctx.fillRect(0, 0, 640, 480);
            
            // ציור נקודות
            if(results.poseLandmarks) draw(results.poseLandmarks, "#FF00FF");
            if(results.faceLandmarks) draw(results.faceLandmarks, "#00FFFF");
            if(results.leftHandLandmarks) draw(results.leftHandLandmarks, "#FFFF00");

            // כתיבת נתונים לדיבאג
            ctx.fillStyle = "white";
            ctx.font = "20px Arial";
            
            let status = "לא רואה כלום";
            if(results.faceLandmarks) {
                const nose = results.faceLandmarks[1];
                status = `Face Detected at Y: ${nose.y.toFixed(2)}`;
                
                // בדיקת מגע פשוטה מאוד (מרחק אוקלידי)
                if(results.leftHandLandmarks) {
                    const wrist = results.leftHandLandmarks[0];
                    const dist = Math.hypot(wrist.x - nose.x, wrist.y - nose.y);
                    ctx.fillText(`Distance: ${dist.toFixed(2)}`, 50, 50);
                    
                    if(dist < 0.2) {
                        ctx.fillStyle = "red";
                        ctx.fillText("!! מגע מזוהה !!", 50, 100);
                    }
                }
            }
            ctx.fillStyle = "white";
            ctx.fillText(status, 50, 30);
        }

        function draw(lms, color) {
            ctx.fillStyle = color;
            lms.forEach(lm => {
                ctx.beginPath();
                ctx.arc(lm.x * 640, lm.y * 480, 3, 0, Math.PI*2);
                ctx.fill();
            });
        }
    </script>
</body>
</html>
