<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PLD - זיהוי הבעות פנים ומגע</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/holistic/holistic.js" crossorigin="anonymous"></script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            background-color: #222;
            color: white;
            margin: 0;
            padding: 20px;
        }
        button {
            font-size: 18px;
            padding: 12px 25px;
            margin: 10px;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            background-color: #0078D7;
            color: white;
            transition: 0.3s;
        }
        button:disabled {
            background-color: #555;
            cursor: not-allowed;
            color: #888;
        }
        button:hover:not(:disabled) {
            background-color: #005a9e;
        }
        #container {
            position: relative;
            margin: 20px auto;
            width: 640px;
            height: 480px;
            border: 2px solid #555;
            border-radius: 10px;
            overflow: hidden;
            background-color: black;
        }
        video {
            display: none; 
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        #status {
            font-size: 20px;
            margin-top: 15px;
            min-height: 30px;
            font-weight: bold;
        }
        .controls {
            background-color: #333;
            padding: 15px;
            border-radius: 10px;
            display: inline-block;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <h1>מעבדת PLD: הבעות פנים ומגע (קנה מידה דינמי)</h1>
    
    <div class="controls">
        <button id="connectBtn">1. התחבר למיקרוביט</button>
        <button id="startCamBtn">2. הפעל מצלמה (PLD)</button>
    </div>

    <div id="status">ממתין לפעולה...</div>

    <div id="container">
        <video id="input_video" autoplay playsinline></video>
        <canvas id="output_canvas" width="640" height="480"></canvas>
    </div>

    <script>
        // -- הגדרות מיקרוביט --
        let port;
        let writer;
        const connectBtn = document.getElementById('connectBtn');
        const statusDiv = document.getElementById('status');

        connectBtn.addEventListener('click', async () => {
            try {
                port = await navigator.serial.requestPort();
                await port.open({ baudRate: 115200 });
                const textEncoder = new TextEncoderStream();
                textEncoder.readable.pipeTo(port.writable);
                writer = textEncoder.writable.getWriter();
                statusDiv.innerText = "מחובר למיקרוביט בהצלחה!";
                statusDiv.style.color = "#4CAF50";
            } catch (error) {
                console.error(error);
                statusDiv.innerText = "שגיאת התחברות למיקרוביט.";
                statusDiv.style.color = "#F44336";
            }
        });

        async function sendCommand(cmd) {
            if (writer) {
                await writer.write(cmd + '\r\n');
            }
        }

        // -- הגדרות MediaPipe ו-PLD --
        const videoElement = document.getElementById('input_video');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const startCamBtn = document.getElementById('startCamBtn');

        let lastMouthDist = null;
        let lastLeftEyeDist = null;
        let lastRightEyeDist = null;
        
        let lastSendTime = 0;
        const SEND_COOLDOWN = 300; 

        // רגישות
        const EXPRESSION_THRESHOLD = 0.005; 
        const TOUCH_MULTIPLIER = 1.2; // המכפיל של רוחב הפנים - מגדיר כמה רחוק מהפנים נחשב "מגע"

        const holistic = new Holistic({locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/holistic/${file}`;
        }});

        holistic.setOptions({
            modelComplexity: 1,
            smoothLandmarks: true,
            enableSegmentation: false,
            smoothSegmentation: false,
            refineFaceLandmarks: true,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        holistic.onResults(onResults);

        startCamBtn.addEventListener('click', () => {
            startCamBtn.disabled = true;
            statusDiv.innerText = "טוען מודל זיהוי...";
            statusDiv.style.color = "white";
            
            const camera = new Camera(videoElement, {
                onFrame: async () => {
                    await holistic.send({image: videoElement});
                },
                width: 640,
                height: 480
            });
            camera.start();
        });

        function getDistance(lm1, lm2) {
            if (!lm1 || !lm2) return 0;
            return Math.hypot(lm1.x - lm2.x, lm1.y - lm2.y);
        }

        function getCenter(landmarks) {
            if (!landmarks || landmarks.length === 0) return null;
            let sumX = 0, sumY = 0;
            landmarks.forEach(lm => {
                sumX += lm.x;
                sumY += lm.y;
            });
            return { x: sumX / landmarks.length, y: sumY / landmarks.length };
        }

        // שים לב שהפונקציה מקבלת עכשיו את הסף (threshold) הדינמי כפרמטר
        function isHandTouchingFace(handLandmarks, faceCenter, dynamicThreshold) {
            if (!handLandmarks || !faceCenter) return false;
            for (let i of [0, 8]) { // 0 = שורש כף יד, 8 = קצה אצבע מורה
                let lm = handLandmarks[i];
                let dist = Math.hypot(lm.x - faceCenter.x, lm.y - faceCenter.y);
                if (dist < dynamicThreshold) return true;
            }
            return false;
        }

        function drawPLDPoints(landmarks, color = "white", size = 3) {
            if (!landmarks) return;
            canvasCtx.fillStyle = color;
            landmarks.forEach(lm => {
                const x = lm.x * canvasElement.width;
                const y = lm.y * canvasElement.height;
                canvasCtx.beginPath();
                canvasCtx.arc(x, y, size, 0, 2 * Math.PI);
                canvasCtx.fill();
            });
        }

        function onResults(results) {
            canvasCtx.fillStyle = 'black';
            canvasCtx.fillRect(0, 0, canvasElement.width, canvasElement.height);

            drawPLDPoints(results.poseLandmarks, "#FF00FF", 4); 
            drawPLDPoints(results.faceLandmarks, "rgba(0, 255, 255, 0.6)", 2);
            drawPLDPoints(results.leftHandLandmarks, "#FFFF00", 3);
            drawPLDPoints(results.rightHandLandmarks, "#FFFF00", 3);

            let triggerS = false;
            let eventText = "";

            if (results.faceLandmarks) {
                // הבעות פנים
                const mouthDist = getDistance(results.faceLandmarks[13], results.faceLandmarks[14]);
                const leftEyeDist = getDistance(results.faceLandmarks[159], results.faceLandmarks[145]);
                const rightEyeDist = getDistance(results.faceLandmarks[386], results.faceLandmarks[374]);

                if (lastMouthDist !== null) {
                    if (Math.abs(mouthDist - lastMouthDist) > EXPRESSION_THRESHOLD) {
                        triggerS = true;
                        eventText = "תנועת פה!";
                    }
                    else if (Math.abs(leftEyeDist - lastLeftEyeDist) > EXPRESSION_THRESHOLD || 
                             Math.abs(rightEyeDist - lastRightEyeDist) > EXPRESSION_THRESHOLD) {
                        triggerS = true;
                        eventText = "תנועת עיניים!";
                    }
                }

                lastMouthDist = mouthDist;
                lastLeftEyeDist = leftEyeDist;
                lastRightEyeDist = rightEyeDist;

                // --- מנגנון המגע הדינמי החדש ---
                let currentFaceCenter = getCenter(results.faceLandmarks);
                
                // חישוב רוחב הפנים הנוכחי כמרחק בין הקצוות החיצוניים של העיניים (נקודות 33 ו-263)
                const faceWidth = getDistance(results.faceLandmarks[33], results.faceLandmarks[263]);
                
                // קביעת הרדיוס למגע: רוחב הפנים כפול המקדם שלנו
                const dynamicTouchThreshold = faceWidth * TOUCH_MULTIPLIER;

                if (currentFaceCenter && !triggerS) { 
                    if (isHandTouchingFace(results.leftHandLandmarks, currentFaceCenter, dynamicTouchThreshold) || 
                        isHandTouchingFace(results.rightHandLandmarks, currentFaceCenter, dynamicTouchThreshold)) {
                        triggerS = true;
                        eventText = "מגע בפנים!";
                    }
                }
            }

            // שליחה למיקרוביט
            const now = Date.now();
            if (triggerS && (now - lastSendTime > SEND_COOLDOWN)) {
                sendCommand('S');
                lastSendTime = now;
                statusDiv.innerText = `זיהוי: ${eventText}`;
                statusDiv.style.color = "#FF9800";
                
                setTimeout(() => {
                    if (Date.now() - lastSendTime >= SEND_COOLDOWN) {
                        statusDiv.innerText = "עוקב...";
                        statusDiv.style.color = "white";
                    }
                }, 500);
            } else if (!triggerS && (now - lastSendTime > SEND_COOLDOWN)) {
                if(statusDiv.innerText !== "עוקב..." && statusDiv.innerText !== "מחובר למיקרוביט בהצלחה!" && !statusDiv.innerText.includes("טוען")) {
                    statusDiv.innerText = "עוקב...";
                    statusDiv.style.color = "white";
                }
            }
        }
    </script>
</body>
</html>
