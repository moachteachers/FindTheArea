<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PLD - הבעות פנים וזיהוי מגע תלת-ממדי</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/holistic/holistic.js" crossorigin="anonymous"></script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            background-color: #222;
            color: white;
            margin: 0;
            padding: 20px;
        }
        button {
            font-size: 18px;
            padding: 12px 25px;
            margin: 10px;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            background-color: #0078D7;
            color: white;
            transition: 0.3s;
        }
        button:disabled {
            background-color: #555;
            cursor: not-allowed;
            color: #888;
        }
        button:hover:not(:disabled) {
            background-color: #005a9e;
        }
        #container {
            position: relative;
            margin: 20px auto;
            width: 640px;
            height: 480px;
            border: 2px solid #555;
            border-radius: 10px;
            overflow: hidden;
            background-color: black;
        }
        video {
            display: none; 
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        #status {
            font-size: 20px;
            margin-top: 15px;
            min-height: 30px;
            font-weight: bold;
        }
        .controls {
            background-color: #333;
            padding: 15px;
            border-radius: 10px;
            display: inline-block;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <h1>מעבדת PLD: הבעות פנים ומגע עומק (3D)</h1>
    
    <div class="controls">
        <button id="connectBtn">1. התחבר למיקרוביט</button>
        <button id="startCamBtn">2. הפעל מצלמה (PLD)</button>
    </div>

    <div id="status">ממתין לפעולה...</div>

    <div id="container">
        <video id="input_video" autoplay playsinline></video>
        <canvas id="output_canvas" width="640" height="480"></canvas>
    </div>

    <script>
        // -- הגדרות מיקרוביט --
        let port;
        let writer;
        const connectBtn = document.getElementById('connectBtn');
        const statusDiv = document.getElementById('status');

        connectBtn.addEventListener('click', async () => {
            try {
                port = await navigator.serial.requestPort();
                await port.open({ baudRate: 115200 });
                const textEncoder = new TextEncoderStream();
                textEncoder.readable.pipeTo(port.writable);
                writer = textEncoder.writable.getWriter();
                statusDiv.innerText = "מחובר למיקרוביט בהצלחה!";
                statusDiv.style.color = "#4CAF50";
            } catch (error) {
                console.error(error);
                statusDiv.innerText = "שגיאת התחברות למיקרוביט.";
                statusDiv.style.color = "#F44336";
            }
        });

        async function sendCommand(cmd) {
            if (writer) {
                await writer.write(cmd + '\r\n');
            }
        }

        // -- הגדרות MediaPipe ו-PLD --
        const videoElement = document.getElementById('input_video');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const startCamBtn = document.getElementById('startCamBtn');

        let lastMouthDist = null;
        let lastLeftEyeDist = null;
        let lastRightEyeDist = null;
        
        let lastSendTime = 0;
        const SEND_COOLDOWN = 300; 

        // רגישות וסף המגע
        const EXPRESSION_THRESHOLD = 0.005; 
        const TOUCH_MULTIPLIER = 1.2; // רדיוס המגע על המסך (דו-ממד)
        const DEPTH_MULTIPLIER = 1.6; // סבולת העומק: כמה היד יכולה להיות "רחוקה" מהפנים בציר העומק כדי להיחשב מגע

        const holistic = new Holistic({locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/holistic/${file}`;
        }});

        holistic.setOptions({
            modelComplexity: 1,
            smoothLandmarks: true,
            enableSegmentation: false,
            smoothSegmentation: false,
            refineFaceLandmarks: true,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        holistic.onResults(onResults);

        startCamBtn.addEventListener('click', () => {
            startCamBtn.disabled = true;
            statusDiv.innerText = "טוען מודל זיהוי...";
            statusDiv.style.color = "white";
            
            const camera = new Camera(videoElement, {
                onFrame: async () => {
                    await holistic.send({image: videoElement});
                },
                width: 640,
                height: 480
            });
            camera.start();
        });

        function getDistance(lm1, lm2) {
            if (!lm1 || !lm2) return 0;
            return Math.hypot(lm1.x - lm2.x, lm1.y - lm2.y);
        }

        // פונקציה חדשה שבודקת מגע ב-3D באמצעות מודל הגוף
        function isHandTouchingFace3D(poseLandmarks, faceWidth) {
            if (!poseLandmarks) return false;

            // ניקח את האף (נקודה 0) בתור המרכז התלת-ממדי של הפנים
            const nose = poseLandmarks[0];
            if (!nose) return false;

            const xyThreshold = faceWidth * TOUCH_MULTIPLIER; // סף לרוחב/גובה
            const zThreshold = faceWidth * DEPTH_MULTIPLIER;  // סף לעומק (המרחק אל המצלמה)

            // הנקודות שאותן נבדוק מול הפנים: 
            // 15: שורש כף יד שמאל, 19: אצבע מורה שמאל
            // 16: שורש כף יד ימין, 20: אצבע מורה ימין
            const handPoints = [15, 19, 16, 20]; 
            
            for (let i of handPoints) {
                let handPart = poseLandmarks[i];
                if (!handPart) continue;

                // בדיקת המרחק הדו-ממדי (X ו-Y)
                let xyDist = Math.hypot(handPart.x - nose.x, handPart.y - nose.y);
                
                // בדיקת המרחק בעומק (Z)
                let zDist = Math.abs(handPart.z - nose.z);

                // רק אם היד קרובה לפנים גם ב-XY וגם נמצאת קרוב אליהן בציר ה-Z, נחשיב את זה כמגע
                if (xyDist < xyThreshold && zDist < zThreshold) {
                    return true;
                }
            }
            return false;
        }

        function drawPLDPoints(landmarks, color = "white", size = 3) {
            if (!landmarks) return;
            canvasCtx.fillStyle = color;
            landmarks.forEach(lm => {
                const x = lm.x * canvasElement.width;
                const y = lm.y * canvasElement.height;
                canvasCtx.beginPath();
                canvasCtx.arc(x, y, size, 0, 2 * Math.PI);
                canvasCtx.fill();
            });
        }

        function onResults(results) {
            canvasCtx.fillStyle = 'black';
            canvasCtx.fillRect(0, 0, canvasElement.width, canvasElement.height);

            drawPLDPoints(results.poseLandmarks, "#FF00FF", 4); 
            drawPLDPoints(results.faceLandmarks, "rgba(0, 255, 255, 0.6)", 2);
            drawPLDPoints(results.leftHandLandmarks, "#FFFF00", 3);
            drawPLDPoints(results.rightHandLandmarks, "#FFFF00", 3);

            let triggerS = false;
            let eventText = "";

            if (results.faceLandmarks && results.poseLandmarks) {
                
                // --- 1. זיהוי הבעות פנים ---
                const mouthDist = getDistance(results.faceLandmarks[13], results.faceLandmarks[14]);
                const leftEyeDist = getDistance(results.faceLandmarks[159], results.faceLandmarks[145]);
                const rightEyeDist = getDistance(results.faceLandmarks[386], results.faceLandmarks[374]);

                if (lastMouthDist !== null) {
                    if (Math.abs(mouthDist - lastMouthDist) > EXPRESSION_THRESHOLD) {
                        triggerS = true;
                        eventText = "תנועת פה!";
                    }
                    else if (Math.abs(leftEyeDist - lastLeftEyeDist) > EXPRESSION_THRESHOLD || 
                             Math.abs(rightEyeDist - lastRightEyeDist) > EXPRESSION_THRESHOLD) {
                        triggerS = true;
                        eventText = "תנועת עיניים!";
                    }
                }

                lastMouthDist = mouthDist;
                lastLeftEyeDist = leftEyeDist;
                lastRightEyeDist = rightEyeDist;

                // --- 2. זיהוי מגע תלת-ממדי ---
                // חישוב רוחב הפנים עבור קנה המידה הדינמי
                const faceWidth = getDistance(results.faceLandmarks[33], results.faceLandmarks[263]);
                
                if (!triggerS) { // בודקים מגע רק אם לא הייתה קפיצה של הבעות הפנים
                    if (isHandTouchingFace3D(results.poseLandmarks, faceWidth)) {
                        triggerS = true;
                        eventText = "מגע בפנים!";
                    }
                }
            }

            // שליחה למיקרוביט והצגה על המסך
            const now = Date.now();
            if (triggerS && (now - lastSendTime > SEND_COOLDOWN)) {
                sendCommand('S');
                lastSendTime = now;
                statusDiv.innerText = `זיהוי: ${eventText}`;
                statusDiv.style.color = "#FF9800";
                
                setTimeout(() => {
                    if (Date.now() - lastSendTime >= SEND_COOLDOWN) {
                        statusDiv.innerText = "עוקב...";
                        statusDiv.style.color = "white";
                    }
                }, 500);
            } else if (!triggerS && (now - lastSendTime > SEND_COOLDOWN)) {
                if(statusDiv.innerText !== "עוקב..." && statusDiv.innerText !== "מחובר למיקרוביט בהצלחה!" && !statusDiv.innerText.includes("טוען")) {
                    statusDiv.innerText = "עוקב...";
                    statusDiv.style.color = "white";
                }
            }
        }
    </script>
</body>
</html>
