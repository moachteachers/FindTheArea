<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PLD - מעבדה (מצב שקט)</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/holistic/holistic.js" crossorigin="anonymous"></script>

    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            text-align: center; 
            background-color: #111; 
            color: white; 
            margin: 0; 
            padding: 20px; 
        }
        button { 
            font-size: 18px; 
            padding: 12px 25px; 
            margin: 10px; 
            cursor: pointer; 
            border: none; 
            border-radius: 8px; 
            background-color: #0078D7; 
            color: white; 
            transition: 0.3s; 
        }
        button:disabled { background-color: #444; cursor: not-allowed; color: #888; }
        button:hover:not(:disabled) { background-color: #005a9e; }
        
        #container { 
            position: relative; 
            margin: 10px auto; 
            width: 800px; 
            height: 450px; 
            border: 2px solid #555; 
            border-radius: 10px; 
            overflow: hidden; 
            background-color: black; 
        }
        video { display: none; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        
        .controls { 
            background-color: #222; 
            padding: 10px; 
            border-radius: 10px; 
            display: inline-block; 
            margin-bottom: 10px; 
            border: 1px solid #444;
        }

        /* חיווי מרכזי אחוד וניטרלי */
        #main-status {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            padding: 10px 30px;
            border-radius: 20px;
            font-size: 22px;
            font-weight: bold;
            border: 2px solid #333;
            z-index: 10;
            transition: 0.1s;
        }
    </style>
</head>
<body>

    <h1>מעבדת PLD: ניטור תנועה</h1>
    
    <div class="controls">
        <button id="connectBtn">1. התחבר למיקרוביט</button>
        <button id="startCamBtn">2. הפעל מצלמה</button>
    </div>

    <div id="container">
        <video id="input_video" autoplay playsinline></video>
        <canvas id="output_canvas" width="1280" height="720"></canvas>
        
        <div id="main-status">ממתין להפעלה...</div>
    </div>

    <script>
        // --- 1. תקשורת מיקרוביט ---
        let port, writer;
        const connectBtn = document.getElementById('connectBtn');
        const mainStatusDiv = document.getElementById('main-status');

        connectBtn.addEventListener('click', async () => {
            try {
                port = await navigator.serial.requestPort();
                await port.open({ baudRate: 115200 });
                
                const textEncoder = new TextEncoderStream();
                textEncoder.readable.pipeTo(port.writable);
                writer = textEncoder.writable.getWriter();
                
                mainStatusDiv.innerText = "מחובר למיקרוביט!";
                mainStatusDiv.style.color = "#4CAF50";
                mainStatusDiv.style.borderColor = "#4CAF50";
            } catch (error) {
                console.error("שגיאת התחברות:", error);
                mainStatusDiv.innerText = "שגיאת התחברות.";
                mainStatusDiv.style.color = "#F44336";
                mainStatusDiv.style.borderColor = "#F44336";
            }
        });

        // משתנה נעילה למניעת הצפה (Cooldown) - מוסתר מהמשתמש
        let isCooldown = false;

        // פונקציית שידור שקטה לחלוטין - לא נוגעת בתצוגה שעל המסך
        async function triggerBurst() {
            if (isCooldown) return; 
            
            isCooldown = true;
            
            if (writer) {
                // לולאה ששולחת את האות 3 פעמים
                for (let i = 0; i < 3; i++) {
                    try {
                        await writer.write('S\r\n');
                        console.log("נשלח: S"); // מופיע רק ב-F12 לחוקר
                    } catch (err) {
                        console.error("שגיאת כתיבה:", err);
                    }
                    await new Promise(resolve => setTimeout(resolve, 100)); // השהייה של 100ms בין אותיות
                }
            } else {
                await new Promise(resolve => setTimeout(resolve, 300));
            }

            // שחרור הנעילה אחרי שנייה אחת
            setTimeout(() => {
                isCooldown = false;
            }, 1000);
        }

        // --- 2. לוגיקת מעקב הראייה הממוחשבת ---
        let lastMouthDist = null;
        let lastNosePos = null;
        let lastBodyCenter = null;
        let lastLeftHand = null;
        let lastRightHand = null;
        let lastDetectionTime = 0; 

        const videoElement = document.getElementById('input_video');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');

        const holistic = new Holistic({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/holistic/${file}`});
        holistic.setOptions({
            modelComplexity: 1, smoothLandmarks: true, enableSegmentation: false,
            smoothSegmentation: false, refineFaceLandmarks: true,
            minDetectionConfidence: 0.5, minTrackingConfidence: 0.5
        });
        holistic.onResults(onResults);

        document.getElementById('startCamBtn').addEventListener('click', (e) => {
            e.target.disabled = true;
            mainStatusDiv.innerText = "טוען מצלמה...";
            new Camera(videoElement, { onFrame: async () => { await holistic.send({image: videoElement}); }, width: 1280, height: 720 }).start();
        });

        function getDistance(lm1, lm2) {
            if (!lm1 || !lm2) return 0;
            return Math.hypot(lm1.x - lm2.x, lm1.y - lm2.y);
        }

        function getCenter(landmarks) {
            if (!landmarks || landmarks.length === 0) return null;
            let sumX = 0, sumY = 0;
            landmarks.forEach(lm => { sumX += lm.x; sumY += lm.y; });
            return { x: sumX / landmarks.length, y: sumY / landmarks.length };
        }

        function drawPLDPoints(landmarks, color, size) {
            if (!landmarks) return;
            canvasCtx.fillStyle = color;
            landmarks.forEach(lm => {
                canvasCtx.beginPath();
                canvasCtx.arc(lm.x * canvasElement.width, lm.y * canvasElement.height, size, 0, 2 * Math.PI);
                canvasCtx.fill();
            });
        }

        function onResults(results) {
            canvasCtx.fillStyle = 'black';
            canvasCtx.fillRect(0, 0, canvasElement.width, canvasElement.height);

            drawPLDPoints(results.poseLandmarks, "#FF00FF", 4); 
            drawPLDPoints(results.faceLandmarks, "rgba(0, 255, 255, 0.6)", 2); 
            drawPLDPoints(results.leftHandLandmarks, "#FFFF00", 3); 
            drawPLDPoints(results.rightHandLandmarks, "#FFFF00", 3);

            let state = {
                mouthMove: false,
                faceTouch: false,
                headMove: false,
                bodyMove: false,
                handMove: false,
                handTouch: false
            };

            if (results.faceLandmarks && results.poseLandmarks) {
                const faceWidth = getDistance(results.faceLandmarks[33], results.faceLandmarks[263]);
                const shoulderWidth = getDistance(results.poseLandmarks[11], results.poseLandmarks[12]);
                
                if (faceWidth > 0.02 && shoulderWidth > 0.05) { 
                    
                    // זיהוי תנועת פה
                    const mouthDist = getDistance(results.faceLandmarks[13], results.faceLandmarks[14]);
                    if (lastMouthDist !== null && Math.abs(mouthDist - lastMouthDist) > faceWidth * 0.06) {
                        state.mouthMove = true;
                    }
                    lastMouthDist = mouthDist;

                    const noseFace = results.faceLandmarks[1];
                    const leftHandCenter = getCenter(results.leftHandLandmarks);
                    const rightHandCenter = getCenter(results.rightHandLandmarks);

                    // זיהוי מגע בפנים
                    [results.leftHandLandmarks, results.rightHandLandmarks].forEach(hand => {
                        if (hand) {
                            let isOverlapping = false;
                            for (let i of [8, 12, 16, 20]) { 
                                if (getDistance(hand[i], noseFace) < faceWidth * 1.2) { isOverlapping = true; break; }
                            }
                            const handSize = getDistance(hand[0], hand[9]);
                            if (isOverlapping && (handSize / faceWidth < 1.8)) {
                                state.faceTouch = true;
                            }
                        }
                    });

                    // זיהוי תנועת ראש
                    if (lastNosePos && getDistance(noseFace, lastNosePos) / faceWidth > 0.05) state.headMove = true;
                    lastNosePos = noseFace;

                    // זיהוי תנועת גוף
                    const bodyCenter = getCenter([results.poseLandmarks[11], results.poseLandmarks[12], results.poseLandmarks[23], results.poseLandmarks[24]]);
                    if (lastBodyCenter && bodyCenter && getDistance(bodyCenter, lastBodyCenter) / shoulderWidth > 0.03) state.bodyMove = true;
                    lastBodyCenter = bodyCenter;

                    // זיהוי תנועת ידיים
                    [results.leftHandLandmarks, results.rightHandLandmarks].forEach(hand => {
                        if (hand) {
                            const handCenter = getCenter(hand);
                            const lastHandCenter = (hand === results.leftHandLandmarks) ? lastLeftHand : lastRightHand;
                            if (lastHandCenter && getDistance(handCenter, lastHandCenter) / shoulderWidth > 0.08) state.handMove = true;
                            if (hand === results.leftHandLandmarks) lastLeftHand = handCenter;
                            else lastRightHand = handCenter;
                        }
                    });

                    // זיהוי מגע בין הידיים
                    if (leftHandCenter && rightHandCenter && getDistance(leftHandCenter, rightHandCenter) / shoulderWidth < 0.35) {
                        state.handTouch = true;
                    }
                }
            }

            // --- 3. עדכון התצוגה ושליחה נסתרת לחומרה ---
            
            // בדיקת טריגרים לשליחת אות (מאחורי הקלעים)
            if (state.mouthMove || state.faceTouch) {
                triggerBurst();
            }

            // עדכון הממשק הויזואלי (צבע אחיד לכל סוגי הזיהוי)
            let uiText = "";
            
            // בחר את הפעולה הבולטת ביותר להצגה על המסך
            if (state.faceTouch) uiText = "מגע בפנים";
            else if (state.mouthMove) uiText = "תנועת פה";
            else if (state.handTouch) uiText = "מגע בידיים";
            else if (state.handMove) uiText = "תנועת ידיים";
            else if (state.headMove) uiText = "תנועת ראש";
            else if (state.bodyMove) uiText = "תנועת גוף";

            if (uiText) {
                // כל תנועה מוצגת באותו צבע (טורקיז) כדי לא להסגיר מתי נשלח אות למיקרוביט
                mainStatusDiv.innerText = `זיהוי: ${uiText}`;
                mainStatusDiv.style.color = "#00BCD4"; 
                mainStatusDiv.style.borderColor = "#00BCD4";
                lastDetectionTime = Date.now();
            } 
            else if (Date.now() - lastDetectionTime > 400) {
                // אם הכל שקט, חזור למצב סורק
                if(mainStatusDiv.innerText !== "סורק..." && !mainStatusDiv.innerText.includes("מחובר") && !mainStatusDiv.innerText.includes("שגיאה")) {
                    mainStatusDiv.innerText = "סורק..."; 
                    mainStatusDiv.style.color = "white";
                    mainStatusDiv.style.borderColor = "#333";
                }
            }
        }
    </script>
</body>
</html>
