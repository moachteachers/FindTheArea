<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PLD - מעבדה</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/holistic/holistic.js"></script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            background-color: #222;
            color: white;
            margin: 0;
            padding: 20px;
        }
        button {
            font-size: 18px;
            padding: 12px 25px;
            margin: 10px;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            background-color: #0078D7;
            color: white;
            transition: 0.3s;
        }
        button:disabled { background-color: #555; cursor: not-allowed; color: #888; }
        #container {
            position: relative; margin: 20px auto; width: 640px; height: 480px;
            border: 2px solid #555; border-radius: 10px; overflow: hidden; background-color: black;
        }
        video { display: none; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        #status { font-size: 20px; margin-top: 15px; min-height: 30px; font-weight: bold; }
        #systemCheck { color: #ffeb3b; margin-top: 10px; font-weight: bold; font-size: 16px;}
        .controls { background-color: #333; padding: 15px; border-radius: 10px; display: inline-block; margin-bottom: 20px; }
        #debug { color: #aaa; font-size: 14px; margin-top: 10px; font-family: monospace; }
    </style>
</head>
<body>

    <h1>מעבדת PLD</h1>
    
    <div class="controls">
        <button id="connectBtn" disabled>1. התחבר למיקרוביט</button>
        <button id="startCamBtn" disabled>2. הפעל מצלמה</button>
    </div>

    <div id="systemCheck">מבצע בדיקת מערכת לשרת ה-Deploy...</div>
    <div id="status">ממתין לפעולה...</div>
    <div id="debug">פרופורציית יד/פנים: ---</div>

    <div id="container">
        <video id="input_video" autoplay playsinline></video>
        <canvas id="output_canvas" width="640" height="480"></canvas>
    </div>

    <script>
        // --- 1. בדיקת סביבת ה-Deploy (מנגנון חדש) ---
        window.onload = () => {
            const systemCheck = document.getElementById('systemCheck');
            const connectBtn = document.getElementById('connectBtn');
            const startCamBtn = document.getElementById('startCamBtn');
            
            let isSecure = window.location.protocol === 'https:' || window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
            
            if (!isSecure) {
                systemCheck.innerHTML = "❌ שגיאת Deploy: האתר לא מאובטח (HTTP). המצלמה והמיקרוביט לא יעבדו.";
                systemCheck.style.color = "red";
                return;
            }
            
            if (!navigator.serial) {
                systemCheck.innerHTML = "❌ שגיאה: הדפדפן או השרת חוסמים את ה-Web Serial API.";
                systemCheck.style.color = "red";
                return;
            }

            systemCheck.innerHTML = "✅ סביבת השרת תקינה. כל המערכות מוכנות.";
            systemCheck.style.color = "#4CAF50";
            connectBtn.disabled = false;
            startCamBtn.disabled = false;
        };

        // --- 2. לוגיקת המיקרוביט ---
        let port;
        let writer;
        const connectBtn = document.getElementById('connectBtn');
        const statusDiv = document.getElementById('status');
        const debugDiv = document.getElementById('debug');

        connectBtn.addEventListener('click', async () => {
            try {
                port = await navigator.serial.requestPort();
                await port.open({ baudRate: 115200 });
                const textEncoder = new TextEncoderStream();
                textEncoder.readable.pipeTo(port.writable);
                writer = textEncoder.writable.getWriter();
                statusDiv.innerText = "מחובר למיקרוביט בהצלחה!";
                statusDiv.style.color = "#4CAF50";
            } catch (error) {
                statusDiv.innerText = "שגיאת התחברות: " + error.message;
                statusDiv.style.color = "#F44336";
            }
        });

        async function sendCommand(cmd) {
            if (writer) await writer.write(cmd + '\r\n');
        }

        // --- 3. לוגיקת MediaPipe ---
        const videoElement = document.getElementById('input_video');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const startCamBtn = document.getElementById('startCamBtn');

        let lastMouthDist = null, lastLeftEyeDist = null, lastRightEyeDist = null;
        let lastSendTime = 0;
        const SEND_COOLDOWN = 300, EXPRESSION_THRESHOLD = 0.005, TOUCH_MULTIPLIER = 1.2, MAX_HAND_FACE_RATIO = 1.8; 

        const holistic = new Holistic({locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/holistic/${file}`;
        }});

        holistic.setOptions({
            modelComplexity: 1, smoothLandmarks: true, enableSegmentation: false,
            smoothSegmentation: false, refineFaceLandmarks: true,
            minDetectionConfidence: 0.5, minTrackingConfidence: 0.5
        });

        holistic.onResults(onResults);

        startCamBtn.addEventListener('click', () => {
            startCamBtn.disabled = true;
            statusDiv.innerText = "טוען מודל זיהוי...";
            statusDiv.style.color = "white";
            
            const camera = new Camera(videoElement, {
                onFrame: async () => { await holistic.send({image: videoElement}); },
                width: 640, height: 480
            });
            camera.start().catch(err => {
                statusDiv.innerText = "שגיאת מצלמה: " + err.message;
                statusDiv.style.color = "red";
            });
        });

        function getDistance(lm1, lm2) {
            if (!lm1 || !lm2) return 0;
            return Math.hypot(lm1.x - lm2.x, lm1.y - lm2.y);
        }

        function getCenter(landmarks) {
            if (!landmarks || landmarks.length === 0) return null;
            let sumX = 0, sumY = 0;
            landmarks.forEach(lm => { sumX += lm.x; sumY += lm.y; });
            return { x: sumX / landmarks.length, y: sumY / landmarks.length };
        }

        function isHandTouchingFace(handLandmarks, faceCenter, faceWidth) {
            if (!handLandmarks || !faceCenter || !faceWidth) return false;

            let isOverlapping = false;
            for (let i of [8, 12, 16, 20]) { 
                let dist = getDistance(handLandmarks[i], faceCenter);
                if (dist < faceWidth * TOUCH_MULTIPLIER) { isOverlapping = true; break; }
            }
            if (!isOverlapping) return false;

            let handSize = getDistance(handLandmarks[0], handLandmarks[9]);
            if (handSize === 0) return false; // מניעת שגיאת חילוק באפס
            
            let ratio = handSize / faceWidth;
            debugDiv.innerText = `פרופורציית יד/פנים (קרוב מדי > ${MAX_HAND_FACE_RATIO}): ${ratio.toFixed(2)}`;

            if (ratio > MAX_HAND_FACE_RATIO) { debugDiv.style.color = "red"; return false; }
            debugDiv.style.color = "green"; return true; 
        }

        function drawPLDPoints(landmarks, color = "white", size = 3) {
            if (!landmarks) return;
            canvasCtx.fillStyle = color;
            landmarks.forEach(lm => {
                canvasCtx.beginPath();
                canvasCtx.arc(lm.x * canvasElement.width, lm.y * canvasElement.height, size, 0, 2 * Math.PI);
                canvasCtx.fill();
            });
        }

        function onResults(results) {
            canvasCtx.fillStyle = 'black';
            canvasCtx.fillRect(0, 0, canvasElement.width, canvasElement.height);

            drawPLDPoints(results.poseLandmarks, "#FF00FF", 4); 
            drawPLDPoints(results.faceLandmarks, "rgba(0, 255, 255, 0.6)", 2);
            drawPLDPoints(results.leftHandLandmarks, "#FFFF00", 3);
            drawPLDPoints(results.rightHandLandmarks, "#FFFF00", 3);

            let triggerS = false, eventText = "";

            if (results.faceLandmarks) {
                const mouthDist = getDistance(results.faceLandmarks[13], results.faceLandmarks[14]);
                const leftEyeDist = getDistance(results.faceLandmarks[159], results.faceLandmarks[145]);
                const rightEyeDist = getDistance(results.faceLandmarks[386], results.faceLandmarks[374]);

                if (lastMouthDist !== null) {
                    if (Math.abs(mouthDist - lastMouthDist) > EXPRESSION_THRESHOLD) { triggerS = true; eventText = "תנועת פה!"; }
                    else if (Math.abs(leftEyeDist - lastLeftEyeDist) > EXPRESSION_THRESHOLD || 
                             Math.abs(rightEyeDist - lastRightEyeDist) > EXPRESSION_THRESHOLD) { triggerS = true; eventText = "תנועת עיניים!"; }
                }

                lastMouthDist = mouthDist; lastLeftEyeDist = leftEyeDist; lastRightEyeDist = rightEyeDist;

                let currentFaceCenter = getCenter(results.faceLandmarks);
                const faceWidth = getDistance(results.faceLandmarks[33], results.faceLandmarks[263]); 

                if (!triggerS && faceWidth > 0) { 
                    if (isHandTouchingFace(results.leftHandLandmarks, currentFaceCenter, faceWidth) ||
                        isHandTouchingFace(results.rightHandLandmarks, currentFaceCenter, faceWidth)) {
                        triggerS = true; eventText = "מגע בפנים!";
                    }
                }
            }

            const now = Date.now();
            if (triggerS && (now - lastSendTime > SEND_COOLDOWN)) {
                sendCommand('S'); lastSendTime = now;
                statusDiv.innerText = `זיהוי: ${eventText}`; statusDiv.style.color = "#FF9800";
                setTimeout(() => { if (Date.now() - lastSendTime >= SEND_COOLDOWN) { statusDiv.innerText = "עוקב..."; statusDiv.style.color = "white"; } }, 500);
            } else if (!triggerS && (now - lastSendTime > SEND_COOLDOWN)) {
                if(statusDiv.innerText !== "עוקב..." && statusDiv.innerText !== "מחובר למיקרוביט בהצלחה!" && !statusDiv.innerText.includes("טוען")) {
                    statusDiv.innerText = "עוקב..."; statusDiv.style.color = "white";
                }
            }
        }
    </script>
</body>
</html>
