<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PLD - כיול מבוסס פרופורציות</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/holistic/holistic.js" crossorigin="anonymous"></script>

    <style>
        body { font-family: 'Segoe UI', sans-serif; text-align: center; background-color: #111; color: white; margin: 0; padding: 20px; }
        button { font-size: 18px; padding: 12px 25px; margin: 10px; cursor: pointer; border: none; border-radius: 8px; background-color: #0078D7; color: white; }
        #container { position: relative; margin: 10px auto; width: 800px; height: 450px; border: 2px solid #555; border-radius: 10px; overflow: hidden; background-color: black; }
        video { display: none; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        #status { font-size: 20px; font-weight: bold; margin-top: 10px; }
        #debug { color: #aaa; font-size: 14px; font-family: monospace; }
    </style>
</head>
<body>

    <h1>מעבדת PLD: לוגיקה מבוססת פרופורציות</h1>
    <button id="connectBtn">1. התחבר למיקרוביט</button>
    <button id="startCamBtn">2. הפעל מצלמה</button>
    <div id="status">ממתין...</div>
    <div id="debug">FaceWidth: 0.00 | Ratio: 0.00</div>

    <div id="container">
        <video id="input_video" autoplay playsinline></video>
        <canvas id="output_canvas" width="1280" height="720"></canvas>
    </div>

    <script>
        // --- תקשורת מיקרוביט ---
        let writer;
        async function sendCommand(cmd) { if (writer) await writer.write(cmd + '\r\n'); }
        document.getElementById('connectBtn').onclick = async () => {
            const port = await navigator.serial.requestPort();
            await port.open({ baudRate: 115200 });
            writer = new TextEncoderStream().readable.pipeTo(port.writable) && new TextEncoderStream().writable.getWriter();
            document.getElementById('status').innerText = "מחובר!";
        };

        // --- לוגיקת MediaPipe ---
        const videoElement = document.getElementById('input_video');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const debug = document.getElementById('debug');
        
        let lastMouthDist = null;
        let lastLeftEyeDist = null;
        let lastRightEyeDist = null;

        const holistic = new Holistic({locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/holistic/${f}`});
        holistic.onResults(onResults);

        document.getElementById('startCamBtn').onclick = () => {
            new Camera(videoElement, { onFrame: () => holistic.send({image: videoElement}), width: 1280, height: 720 }).start();
        };

        function getDistance(lm1, lm2) { return Math.hypot(lm1.x - lm2.x, lm1.y - lm2.y); }

        function onResults(results) {
            canvasCtx.fillStyle = 'black';
            canvasCtx.fillRect(0, 0, 1280, 720);
            
            // ציור נקודות
            [results.poseLandmarks, results.faceLandmarks, results.leftHandLandmarks, results.rightHandLandmarks].forEach(lms => {
                if(lms) lms.forEach(lm => {
                    canvasCtx.fillStyle = "white";
                    canvasCtx.beginPath();
                    canvasCtx.arc(lm.x * 1280, lm.y * 720, 2, 0, Math.PI*2);
                    canvasCtx.fill();
                });
            });

            if (results.faceLandmarks && results.poseLandmarks) {
                // 1. קביעת קנה המידה (רוחב פנים מנורמל)
                const faceWidth = getDistance(results.faceLandmarks[33], results.faceLandmarks[263]);
                if (faceWidth < 0.02) return; // הגנה - פנים קטנות מדי לא אמינות

                // 2. חישוב תנועת הבעות יחסי לרוחב הפנים
                const mouthDist = getDistance(results.faceLandmarks[13], results.faceLandmarks[14]);
                const leftEyeDist = getDistance(results.faceLandmarks[159], results.faceLandmarks[145]);
                
                // ה-Threshold הוא 5% מרוחב הפנים. זה נשאר קבוע יחסית לעצמו!
                const threshold = faceWidth * 0.05; 

                if (lastMouthDist !== null) {
                    if (Math.abs(mouthDist - lastMouthDist) > threshold || 
                        Math.abs(leftEyeDist - lastLeftEyeDist) > threshold) {
                        sendCommand('S');
                        document.getElementById('status').innerText = "זיהוי הבעה!";
                    }
                }
                lastMouthDist = mouthDist; lastLeftEyeDist = leftEyeDist;

                // 3. זיהוי מגע יחסי (בלי תלות ב-Z)
                const faceCenter = {
                    x: results.faceLandmarks[1].x, // נקודת אף
                    y: results.faceLandmarks[1].y
                };
                
                let isTouching = false;
                [results.leftHandLandmarks, results.rightHandLandmarks].forEach(hand => {
                    if(hand) {
                        // בדיקת 4 קצות אצבעות
                        [8, 12, 16, 20].forEach(idx => {
                            // המרחק מחולק ברוחב הפנים - הופך למספר חסר יחידות
                            const relativeDist = getDistance(hand[idx], faceCenter) / faceWidth;
                            if (relativeDist < 1.5) { // 1.5 זה קבוע גיאומטרי - לא משתנה עם המרחק
                                isTouching = true;
                            }
                        });
                    }
                });

                if (isTouching) {
                    sendCommand('S');
                    document.getElementById('status').innerText = "מגע מזוהה!";
                }

                debug.innerText = `FaceWidth: ${faceWidth.toFixed(3)} | Threshold: ${threshold.toFixed(4)}`;
            }
        }
    </script>
</body>
</html>
