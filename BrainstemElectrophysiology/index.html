<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PLD - מעבדת מחקר</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/holistic/holistic.js" crossorigin="anonymous"></script>

    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            text-align: center; 
            background-color: #111; 
            color: white; 
            margin: 0; 
            padding: 20px; 
        }
        button { 
            font-size: 18px; 
            padding: 12px 25px; 
            margin: 10px; 
            cursor: pointer; 
            border: none; 
            border-radius: 8px; 
            background-color: #0078D7; 
            color: white; 
            transition: 0.3s; 
        }
        button:disabled { background-color: #444; cursor: not-allowed; color: #888; }
        button:hover:not(:disabled) { background-color: #005a9e; }
        
        #container { 
            position: relative; 
            margin: 10px auto; 
            width: 800px; 
            height: 450px; 
            border: 2px solid #555; 
            border-radius: 10px; 
            overflow: hidden; 
            background-color: black; 
        }
        video { display: none; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        
        #status { 
            font-size: 24px; 
            margin-top: 15px; 
            min-height: 35px; 
            font-weight: bold; 
        }
        .controls { 
            background-color: #222; 
            padding: 10px; 
            border-radius: 10px; 
            display: inline-block; 
            margin-bottom: 10px; 
            border: 1px solid #444;
        }
    </style>
</head>
<body>

    <h1>מעבדת PLD: הבעות פנים ומגע</h1>
    
    <div class="controls">
        <button id="connectBtn">1. התחבר למיקרוביט</button>
        <button id="startCamBtn">2. הפעל מצלמה</button>
    </div>

    <div id="status">ממתין לפעולה...</div>

    <div id="container">
        <video id="input_video" autoplay playsinline></video>
        <canvas id="output_canvas" width="1280" height="720"></canvas>
    </div>

    <script>
        // --- 1. תקשורת מיקרוביט ---
        let port, writer;
        const connectBtn = document.getElementById('connectBtn');
        const statusDiv = document.getElementById('status');

        connectBtn.addEventListener('click', async () => {
            try {
                port = await navigator.serial.requestPort();
                await port.open({ baudRate: 115200 });
                const textEncoder = new TextEncoderStream();
                textEncoder.readable.pipeTo(port.writable);
                writer = textEncoder.writable.getWriter();
                statusDiv.innerText = "מחובר למיקרוביט בהצלחה!";
                statusDiv.style.color = "#4CAF50";
            } catch (error) {
                statusDiv.innerText = "שגיאת התחברות למיקרוביט.";
                statusDiv.style.color = "#F44336";
            }
        });

        async function sendCommand(cmd) { if (writer) await writer.write(cmd + '\r\n'); }

        // --- 2. פרמטרים ומשתנים גלובליים ---
        const SEND_COOLDOWN = 400; 
        let lastSendTime = 0;
        let lastMouthDist = null;
        let lastLeftEyeDist = null;

        // --- 3. הגדרת MediaPipe ---
        const videoElement = document.getElementById('input_video');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const startCamBtn = document.getElementById('startCamBtn');

        const holistic = new Holistic({locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/holistic/${file}`;
        }});

        holistic.setOptions({
            modelComplexity: 1, 
            smoothLandmarks: true, 
            enableSegmentation: false,
            smoothSegmentation: false, 
            refineFaceLandmarks: true,
            minDetectionConfidence: 0.5, 
            minTrackingConfidence: 0.5
        });

        holistic.onResults(onResults);

        startCamBtn.addEventListener('click', () => {
            startCamBtn.disabled = true;
            statusDiv.innerText = "טוען מצלמה...";
            statusDiv.style.color = "white";
            const camera = new Camera(videoElement, {
                onFrame: async () => { await holistic.send({image: videoElement}); },
                width: 1280, height: 720
            });
            camera.start();
        });

        // --- 4. פונקציות עזר גיאומטריות ---
        function getDistance(lm1, lm2) {
            if (!lm1 || !lm2) return 0;
            return Math.hypot(lm1.x - lm2.x, lm1.y - lm2.y);
        }

        function drawPLDPoints(landmarks, color, size) {
            if (!landmarks) return;
            canvasCtx.fillStyle = color;
            landmarks.forEach(lm => {
                canvasCtx.beginPath();
                canvasCtx.arc(lm.x * canvasElement.width, lm.y * canvasElement.height, size, 0, 2 * Math.PI);
                canvasCtx.fill();
            });
        }

        // --- 5. לולאת העיבוד המרכזית ---
        function onResults(results) {
            // ניקוי המסך השחור
            canvasCtx.fillStyle = 'black';
            canvasCtx.fillRect(0, 0, canvasElement.width, canvasElement.height);

            // ציור הנקודות בצבעים
            drawPLDPoints(results.poseLandmarks, "#FF00FF", 4); // גוף - מג'נטה
            drawPLDPoints(results.faceLandmarks, "rgba(0, 255, 255, 0.6)", 2); // פנים - טורקיז חצי שקוף
            drawPLDPoints(results.leftHandLandmarks, "#FFFF00", 3); // ידיים - צהוב
            drawPLDPoints(results.rightHandLandmarks, "#FFFF00", 3);

            let isTriggered = false;
            let currentEventText = "";

            if (results.faceLandmarks && results.poseLandmarks) {
                // נורמליזציה - קנה מידה מבוסס משתמש
                const faceWidth = getDistance(results.faceLandmarks[33], results.faceLandmarks[263]);
                const shoulderWidth = getDistance(results.poseLandmarks[11], results.poseLandmarks[12]);
                
                if (faceWidth > 0.02) { // מוודא שהפנים גדולות מספיק למדידה אמינה
                    
                    // --- לוגיקת הבעות פנים ---
                    const mouthDist = getDistance(results.faceLandmarks[13], results.faceLandmarks[14]);
                    const leftEyeDist = getDistance(results.faceLandmarks[159], results.faceLandmarks[145]);
                    
                    // סף רגישות שגדל וקטן בהתאם למרחק שלך מהמצלמה
                    const expressionThreshold = faceWidth * 0.06; 

                    if (lastMouthDist !== null) {
                        if (Math.abs(mouthDist - lastMouthDist) > expressionThreshold) {
                            isTriggered = true; currentEventText = "תנועת פה!";
                        }
                        else if (Math.abs(leftEyeDist - lastLeftEyeDist) > expressionThreshold) {
                            isTriggered = true; currentEventText = "תנועת עיניים!";
                        }
                    }
                    lastMouthDist = mouthDist; lastLeftEyeDist = leftEyeDist;

                    // --- לוגיקת מגע תלת-ממדי ---
                    if (!isTriggered && shoulderWidth > 0.05) { 
                        const noseFace = results.faceLandmarks[1];
                        const nosePose = results.poseLandmarks[0]; // לעומק משתמשים במודל הגוף המסונכרן

                        const hands = [results.leftHandLandmarks, results.rightHandLandmarks];
                        hands.forEach(hand => {
                            if (hand && !isTriggered) {
                                const indexFinger = hand[8]; // אצבע מורה למדידת קרבה (XY)
                                const wrist = hand[0];       // שורש כף היד למדידת עומק (Z) יציבה
                                
                                // מרחק מנורמל במישור המסך
                                const distXY = getDistance(indexFinger, noseFace) / faceWidth;
                                // מרחק מנורמל בעומק
                                const distZ = Math.abs(wrist.z - nosePose.z) / shoulderWidth;

                                // תנאי המגע (מורחב מעט כדי למנוע חסימת זיהויים תקינים)
                                if (distXY < 1.5 && distZ < 0.6) {
                                    isTriggered = true;
                                    currentEventText = "מגע בפנים!";
                                }
                            }
                        });
                    }
                }
            }

            // --- 6. עדכון ממשק ושליחה למיקרוביט ---
            const now = Date.now();
            
            if (isTriggered && (now - lastSendTime > SEND_COOLDOWN)) {
                sendCommand('S'); 
                lastSendTime = now;
                
                statusDiv.innerText = `זיהוי: ${currentEventText}`; 
                statusDiv.style.color = "#FF9800"; // צבע כתום בולט לזיהוי
                
            } else if (!isTriggered && (now - lastSendTime > SEND_COOLDOWN)) {
                // אם חלף זמן הקירור ואין זיהוי פעיל כרגע - מחזירים לסטטוס שקט
                if(statusDiv.innerText !== "אין זיהוי פעיל" && statusDiv.innerText !== "מחובר למיקרוביט בהצלחה!" && !statusDiv.innerText.includes("טוען")) {
                    statusDiv.innerText = "אין זיהוי פעיל"; 
                    statusDiv.style.color = "white";
                }
            }
        }
    </script>
</body>
</html>
