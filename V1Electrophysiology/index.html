<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מדידת אור במיקרוביט</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            background-color: #f0f8ff;
            padding: 50px;
        }
        button {
            font-size: 20px;
            padding: 15px 30px;
            margin: 10px;
            cursor: pointer;
            border: none;
            border-radius: 10px;
            background-color: #0078D7;
            color: white;
            transition: 0.3s;
        }
        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        button:hover:not(:disabled) {
            background-color: #005a9e;
        }
        #wordDisplay {
            font-size: 60px;
            font-weight: bold;
            color: #333;
            margin: 40px 0;
            min-height: 80px;
            direction: ltr; /* שומר על המספרים משמאל לימין */
        }
        #status {
            font-size: 18px;
            color: #666;
        }
    </style>
</head>
<body>

    <h1>זיהוי שינויי תאורה במיקרוביט</h1>
    <button id="connectBtn">1. התחבר למיקרוביט (USB)</button>
    <button id="startBtn" disabled>2. התחל קריאה</button>
    
    <div id="wordDisplay">...</div>
    <div id="status">ממתין לחיבור...</div>

    <script>
        let port;
        let writer;
        let reader;
        let isReadingData = false;
        let previousLightLevel = null;
        const threshold = 5; // סף רגישות כדי למנוע קפיצות קטנות ורעש מהחיישן

        const connectBtn = document.getElementById('connectBtn');
        const startBtn = document.getElementById('startBtn');
        const wordDisplay = document.getElementById('wordDisplay');
        const statusDiv = document.getElementById('status');

        // פונקציה להתחברות למיקרוביט דרך Web Serial API
        connectBtn.addEventListener('click', async () => {
            try {
                port = await navigator.serial.requestPort();
                await port.open({ baudRate: 115200 });
                
                // הגדרת ערוץ כתיבה למיקרוביט
                const textEncoder = new TextEncoderStream();
                textEncoder.readable.pipeTo(port.writable);
                writer = textEncoder.writable.getWriter();
                
                statusDiv.innerText = "מחובר למיקרוביט בהצלחה!";
                startBtn.disabled = false;
                
                // התחלת האזנה רציפה לערוץ הקריאה
                readLoop();
                
            } catch (error) {
                console.error('שגיאת התחברות:', error);
                statusDiv.innerText = "ההתחברות נכשלה. ודא שהמיקרוביט מחובר.";
            }
        });

        // לולאה שקוראת את הנתונים שמגיעים מהמיקרוביט ברצף
        async function readLoop() {
            const textDecoder = new TextDecoderStream();
            port.readable.pipeTo(textDecoder.writable);
            reader = textDecoder.readable.getReader();
            
            let buffer = "";

            while (true) {
                const { value, done } = await reader.read();
                if (done) break;
                
                buffer += value;
                let lines = buffer.split('\n');
                buffer = lines.pop(); // שומר את השורה הלא שלמה בבאפר להמשך

                for (let line of lines) {
                    let cleanLine = line.trim();
                    if (cleanLine !== "" && isReadingData) {
                        processLightLevel(cleanLine);
                    }
                }
            }
        }

        // פונקציה לשליחת פקודות למיקרוביט
        async function sendCommand(cmd) {
            if (writer) {
                await writer.write(cmd + '\n');
            }
        }

        // עיבוד רמת האור שהתקבלה
        function processLightLevel(data) {
            const currentLightLevel = parseInt(data);
            
            // מוודא שקיבלנו מספר תקין
            if (!isNaN(currentLightLevel)) {
                wordDisplay.innerText = currentLightLevel;

                if (previousLightLevel !== null) {
                    // בדיקה אם יש עלייה באור מעבר לסף שהגדרנו
                    if (currentLightLevel > previousLightLevel + threshold) {
                        sendCommand('S'); // שליחת 'S' למיקרוביט
                        statusDiv.innerText = "זוהתה עלייה באור! נשלח S";
                        
                        // ניקוי חיווי הסטטוס אחרי 2 שניות
                        setTimeout(() => {
                            if (isReadingData) statusDiv.innerText = "קורא נתונים...";
                        }, 2000);
                    }
                }
                
                previousLightLevel = currentLightLevel;
            }
        }

        // הפעלת או עצירת הקריאה (הלוגיקה)
        startBtn.addEventListener('click', () => {
            if (!isReadingData) {
                isReadingData = true;
                previousLightLevel = null; // איפוס הקריאה הקודמת בכל תחילת מדידה
                startBtn.innerText = "מפסיק קריאה...";
                statusDiv.innerText = "קורא נתונים...";
            } else {
                isReadingData = false;
                startBtn.innerText = "2. התחל קריאה";
                statusDiv.innerText = "הקריאה הופסקה.";
                wordDisplay.innerText = "...";
            }
        });

    </script>
</body>
</html>
