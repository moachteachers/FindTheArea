<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ניסוי אלקטרופיזיולוגי - איזור מס' 2</title>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;700&display=swap" rel="stylesheet">
    <style>
      body {
            font-family: 'Rubik', sans-serif;
            text-align: center;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .controls-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 40px;
        }
        button {
            font-family: 'Rubik', sans-serif;
            font-size: 18px;
            font-weight: bold;
            padding: 15px 30px;
            cursor: pointer;
            border: 2px solid #00d2ff;
            border-radius: 30px;
            background-color: rgba(26, 26, 46, 0.8);
            color: #00d2ff;
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.2), inset 0 0 10px rgba(0, 210, 255, 0.1);
            transition: all 0.3s ease;
            text-transform: uppercase;
        }
        button:hover:not(:disabled) {
            background-color: #00d2ff;
            color: #1a1a2e;
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.6);
            transform: scale(1.05);
        }
        button:disabled {
            border-color: #444;
            color: #666;
            cursor: not-allowed;
            box-shadow: none;
            background-color: rgba(0, 0, 0, 0.2);
        }
        .display-board {
            background: rgba(26, 26, 46, 0.7);
            padding: 40px;
            border-radius: 20px;
            border: 2px solid #3a3a5a;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            width: 80%;
            max-width: 600px;
            backdrop-filter: blur(8px);
        }
        #wordDisplay {
            font-size: 70px;
            font-weight: bold;
            color: #444; 
            margin: 20px 0;
            min-height: 100px;
            transition: all 0.3s ease;
        }
        #status {
            font-size: 18px;
            font-weight: bold;
            color: #888;
            margin-top: 10px;
        }
        
        @keyframes pulse {
            0% { text-shadow: 0 0 10px #00d2ff; }
            50% { text-shadow: 0 0 20px #00d2ff, 0 0 30px #00d2ff; }
            100% { text-shadow: 0 0 10px #00d2ff; }
        }
        .listening-active {
            color: #00d2ff !important;
            animation: pulse 1.5s infinite;
        }
    </style>
</head>
<body>
    <h1>ניסוי אלקטרופיזיולגי - אזור מס' 2</h1>

    <button id="connectBtn">1. התחבר למיקרוביט (USB)</button>
    <button id="startBtn" disabled>2. התחל כיול ומדידה</button>
    
    <div id="wordDisplay">...</div>
    <div id="status">ממתין לחיבור...</div>
    <div id="baselineDisplay"></div>

    <script>
        let port;
        let writer;
        let reader;
        
        let isReadingData = false;
        let isCalibrating = false;
        
        let baselineLight = 0;
        let calibrationReadings = [];
        let lightHistory = []; // שומר את היסטוריית הקריאות ב-2 השניות האחרונות
        
        // פרמטרים שניתן לכוונן
        const SLIGHT_THRESHOLD = 3;       // כמה אור מעל הבסיס ייחשב כעלייה קלה (C)
        const SIGNIFICANT_THRESHOLD = 15; // כמה אור מעל המינימום ב-2 השניות האחרונות ייחשב לקפיצה (S)

        const connectBtn = document.getElementById('connectBtn');
        const startBtn = document.getElementById('startBtn');
        const wordDisplay = document.getElementById('wordDisplay');
        const statusDiv = document.getElementById('status');
        const baselineDisplay = document.getElementById('baselineDisplay');

        connectBtn.addEventListener('click', async () => {
            try {
                port = await navigator.serial.requestPort();
                await port.open({ baudRate: 115200 });
                
                const textEncoder = new TextEncoderStream();
                textEncoder.readable.pipeTo(port.writable);
                writer = textEncoder.writable.getWriter();
                
                statusDiv.innerText = "מחובר למיקרוביט בהצלחה!";
                startBtn.disabled = false;
                
                readLoop();
            } catch (error) {
                console.error('שגיאת התחברות:', error);
                statusDiv.innerText = "ההתחברות נכשלה. ודא שהמיקרוביט מחובר ושאין חלון Console פתוח.";
            }
        });

        async function readLoop() {
            const textDecoder = new TextDecoderStream();
            port.readable.pipeTo(textDecoder.writable);
            reader = textDecoder.readable.getReader();
            
            let buffer = "";

            while (true) {
                const { value, done } = await reader.read();
                if (done) break;
                
                buffer += value;
                let lines = buffer.split('\n');
                buffer = lines.pop(); 

                for (let line of lines) {
                    let cleanLine = line.trim();
                    if (cleanLine !== "" && isReadingData) {
                        processLightLevel(cleanLine);
                    }
                }
            }
        }

        async function sendCommand(cmd) {
            if (writer) {
                await writer.write(cmd + '\r\n'); // שימוש ב-\r\n תואם יותר למיקרוביט
            }
        }

        function processLightLevel(data) {
            const currentLightLevel = parseInt(data);
            if (isNaN(currentLightLevel)) return;

            wordDisplay.innerText = currentLightLevel;
            const now = Date.now();

            // 1. שלב הכיול (3 שניות ראשונות)
            if (isCalibrating) {
                calibrationReadings.push(currentLightLevel);
                return; 
            }

            // 2. עדכון חלון הזמן (2 השניות האחרונות)
            lightHistory.push({ time: now, val: currentLightLevel });
            // ניקוי נתונים ישנים (מעל 2000 מילישניות)
            lightHistory = lightHistory.filter(item => now - item.time <= 2000);

            // 3. ניתוח הנתונים בחלון הזמן
            // מציאת הערך הנמוך ביותר ב-2 השניות האחרונות כדי לזהות קפיצה פתאומית
            let minInWindow = Math.min(...lightHistory.map(item => item.val));
            let isSignificantSpike = (currentLightLevel - minInWindow) >= SIGNIFICANT_THRESHOLD;

            // 4. עץ ההחלטות ושליחת הפקודות
            if (isSignificantSpike) {
                // נשלח ברצף כל עוד הקפיצה נמצאת בתוך חלון ה-2 שניות
                sendCommand('S');
                statusDiv.innerText = "S (קפיצה חדה זוהתה!)";
                statusDiv.style.color = "red";
            } 
            else if (currentLightLevel >= baselineLight + SLIGHT_THRESHOLD) {
                // אין קפיצה חדה בחלון הזמן, אבל עדיין מואר יותר מרמת הבסיס
                sendCommand('C');
                statusDiv.innerText = "C (תאורה מעל הבסיס)";
                statusDiv.style.color = "orange";
            } 
            else {
                // חזרנו לרמת הבסיס או חשוך יותר
                statusDiv.innerText = "רמת בסיס (לא שולח כלום)";
                statusDiv.style.color = "green";
            }
        }

        startBtn.addEventListener('click', () => {
            if (!isReadingData) {
                // תחילת מדידה וכיול
                isReadingData = true;
                isCalibrating = true;
                calibrationReadings = [];
                lightHistory = [];
                
                startBtn.innerText = "מפסיק קריאה...";
                statusDiv.innerText = "מכייל חיישן למשך 3 שניות...";
                statusDiv.style.color = "blue";
                baselineDisplay.innerText = "";

                // סיום הכיול אחרי 3000 מילישניות
                setTimeout(() => {
                    if (!isReadingData) return; // במידה והמשתמש עצר לפני שהסתיים הכיול
                    isCalibrating = false;
                    
                    // חישוב ממוצע רמת הבסיס
                    let sum = calibrationReadings.reduce((a, b) => a + b, 0);
                    baselineLight = Math.round(sum / calibrationReadings.length) || 0;
                    
                    baselineDisplay.innerText = `רמת בסיס כוילה ל: ${baselineLight}`;
                    statusDiv.innerText = "הכיול הסתיים. מנתח נתונים...";
                }, 3000);

            } else {
                // עצירת המדידה
                isReadingData = false;
                startBtn.innerText = "2. התחל כיול ומדידה";
                statusDiv.innerText = "הקריאה הופסקה.";
                statusDiv.style.color = "#666";
                wordDisplay.innerText = "...";
                baselineDisplay.innerText = "";
            }
        });

    </script>
</body>
</html>
