<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מדידת אור במיקרוביט</title>
    <style>
      body {
            font-family: 'Rubik', sans-serif;
            text-align: center;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .controls-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 40px;
        }
        button {
            font-family: 'Rubik', sans-serif;
            font-size: 18px;
            font-weight: bold;
            padding: 15px 30px;
            cursor: pointer;
            border: 2px solid #00d2ff;
            border-radius: 30px;
            background-color: rgba(26, 26, 46, 0.8);
            color: #00d2ff;
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.2), inset 0 0 10px rgba(0, 210, 255, 0.1);
            transition: all 0.3s ease;
            text-transform: uppercase;
        }
        button:hover:not(:disabled) {
            background-color: #00d2ff;
            color: #1a1a2e;
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.6);
            transform: scale(1.05);
        }
        button:disabled {
            border-color: #444;
            color: #666;
            cursor: not-allowed;
            box-shadow: none;
            background-color: rgba(0, 0, 0, 0.2);
        }
        .display-board {
            background: rgba(26, 26, 46, 0.7);
            padding: 40px;
            border-radius: 20px;
            border: 2px solid #3a3a5a;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            width: 80%;
            max-width: 600px;
            backdrop-filter: blur(8px);
        }
        #wordDisplay {
            font-size: 70px;
            font-weight: bold;
            color: #444; 
            margin: 20px 0;
            min-height: 100px;
            transition: all 0.3s ease;
        }
        #status {
            font-size: 18px;
            font-weight: bold;
            color: #888;
            margin-top: 10px;
        }
        
        @keyframes pulse {
            0% { text-shadow: 0 0 10px #00d2ff; }
            50% { text-shadow: 0 0 20px #00d2ff, 0 0 30px #00d2ff; }
            100% { text-shadow: 0 0 10px #00d2ff; }
        }
        .listening-active {
            color: #00d2ff !important;
            animation: pulse 1.5s infinite;
        }
    </style>
</head>
<body>

    <h1>זיהוי שינויי תאורה במיקרוביט</h1>
    <button id="connectBtn">1. התחבר למיקרוביט (USB)</button>
    <button id="startBtn" disabled>2. התחל קריאה</button>
    
    <div id="wordDisplay">...</div>
    <div id="status">ממתין לחיבור...</div>

    <script>
        let port;
        let writer;
        let reader;
        let isReadingData = false;
        let previousLightLevel = null;
        const threshold = 5; // סף רגישות כדי למנוע קפיצות קטנות ורעש מהחיישן

        const connectBtn = document.getElementById('connectBtn');
        const startBtn = document.getElementById('startBtn');
        const wordDisplay = document.getElementById('wordDisplay');
        const statusDiv = document.getElementById('status');

        // פונקציה להתחברות למיקרוביט דרך Web Serial API
        connectBtn.addEventListener('click', async () => {
            try {
                port = await navigator.serial.requestPort();
                await port.open({ baudRate: 115200 });
                
                // הגדרת ערוץ כתיבה למיקרוביט
                const textEncoder = new TextEncoderStream();
                textEncoder.readable.pipeTo(port.writable);
                writer = textEncoder.writable.getWriter();
                
                statusDiv.innerText = "מחובר למיקרוביט בהצלחה!";
                startBtn.disabled = false;
                
                // התחלת האזנה רציפה לערוץ הקריאה
                readLoop();
                
            } catch (error) {
                console.error('שגיאת התחברות:', error);
                statusDiv.innerText = "ההתחברות נכשלה. ודא שהמיקרוביט מחובר.";
            }
        });

        // לולאה שקוראת את הנתונים שמגיעים מהמיקרוביט ברצף
        async function readLoop() {
            const textDecoder = new TextDecoderStream();
            port.readable.pipeTo(textDecoder.writable);
            reader = textDecoder.readable.getReader();
            
            let buffer = "";

            while (true) {
                const { value, done } = await reader.read();
                if (done) break;
                
                buffer += value;
                let lines = buffer.split('\n');
                buffer = lines.pop(); // שומר את השורה הלא שלמה בבאפר להמשך

                for (let line of lines) {
                    let cleanLine = line.trim();
                    if (cleanLine !== "" && isReadingData) {
                        processLightLevel(cleanLine);
                    }
                }
            }
        }

        // פונקציה לשליחת פקודות למיקרוביט
        async function sendCommand(cmd) {
            if (writer) {
                await writer.write(cmd + '\n');
            }
        }

        // עיבוד רמת האור שהתקבלה
        function processLightLevel(data) {
            const currentLightLevel = parseInt(data);
            
            // מוודא שקיבלנו מספר תקין
            if (!isNaN(currentLightLevel)) {
                wordDisplay.innerText = currentLightLevel;

                if (previousLightLevel !== null) {
                    // בדיקה אם יש עלייה באור מעבר לסף שהגדרנו
                    if (currentLightLevel > previousLightLevel + threshold) {
                        sendCommand('S'); // שליחת 'S' למיקרוביט
                        statusDiv.innerText = "זוהתה עלייה באור! נשלח S";
                        
                        // ניקוי חיווי הסטטוס אחרי 2 שניות
                        setTimeout(() => {
                            if (isReadingData) statusDiv.innerText = "קורא נתונים...";
                        }, 2000);
                    }
                }
                
                previousLightLevel = currentLightLevel;
            }
        }

        // הפעלת או עצירת הקריאה (הלוגיקה)
        startBtn.addEventListener('click', () => {
            if (!isReadingData) {
                isReadingData = true;
                previousLightLevel = null; // איפוס הקריאה הקודמת בכל תחילת מדידה
                startBtn.innerText = "מפסיק קריאה...";
                statusDiv.innerText = "קורא נתונים...";
            } else {
                isReadingData = false;
                startBtn.innerText = "2. התחל קריאה";
                statusDiv.innerText = "הקריאה הופסקה.";
                wordDisplay.innerText = "...";
            }
        });

    </script>
</body>
</html>
